services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: codex_memory
      POSTGRES_USER: codex_memory
      POSTGRES_PASSWORD: codex_memory
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex_memory -d codex_memory"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  embedding-service:
    build:
      context: ./apps/embedding-service
    environment:
      MODEL_REPO: Qwen/Qwen3-Embedding-0.6B-GGUF
      MODEL_FILE: Qwen3-Embedding-0.6B-Q8_0.gguf
      MODEL_NAME: Qwen/Qwen3-Embedding-0.6B-GGUF
      EMBEDDING_DIMENSIONS: 1024
      EMBEDDING_BATCH_LIMIT: 16
      EMBEDDING_MAX_TOKENS: 32768
      RERANKER_ENABLED: "${RERANKER_ENABLED:-false}"
      RERANKER_MODEL: n24q02m/Qwen3-Reranker-0.6B-ONNX
      RERANKER_BATCH_LIMIT: 100
      LLAMA_N_CTX: 32768
    volumes:
      - embedding-model-cache:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=5)"'
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      MEMORY_MODE: codex_subscription
      DATABASE_URL: postgres://codex_memory:codex_memory@postgres:5432/codex_memory
      REDIS_URL: redis://redis:6379
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-koed-local-dev-provider-key}
      API_TOKEN_PEPPER: ${API_TOKEN_PEPPER:-koed-local-dev-token-pepper}
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B-GGUF
      EMBEDDING_DIMENSIONS: 1024
      EMBEDDING_VERSION: local-qwen3-embedding-0.6b-gguf-v1
      RERANKING_ENABLED: "${RERANKING_ENABLED:-false}"
      MEMORY_VECTOR_CANDIDATE_LIMIT: 20
      COOKIE_SECURE: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_HOST_PORT:-5173},http://127.0.0.1:${WEB_HOST_PORT:-5173},http://localhost:${HISTORY_WEB_HOST_PORT:-5174},http://127.0.0.1:${HISTORY_WEB_HOST_PORT:-5174}}
      KOED_HOST_CHECKOUT_PATH: ${KOED_HOST_CHECKOUT_PATH:-${PWD}}
    command: >
      sh -c "cd packages/db &&
      node node_modules/node-pg-migrate/bin/node-pg-migrate.js up --migrations-dir src/migrations --migrations-table schema_migrations &&
      cd /app &&
      node apps/api/dist/index.js"
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      MEMORY_MODE: codex_subscription
      DATABASE_URL: postgres://codex_memory:codex_memory@postgres:5432/codex_memory
      REDIS_URL: redis://redis:6379
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-koed-local-dev-provider-key}
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B-GGUF
      EMBEDDING_DIMENSIONS: 1024
      EMBEDDING_VERSION: local-qwen3-embedding-0.6b-gguf-v1
      RERANKING_ENABLED: "${RERANKING_ENABLED:-false}"
      MEMORY_VECTOR_CANDIDATE_LIMIT: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${API_HOST_PORT:-3000}
    environment:
      NODE_ENV: production
      WEB_PORT: 5173
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_started

  history-browser:
    build:
      context: .
      dockerfile: apps/history-browser/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${API_HOST_PORT:-3000}
    environment:
      NODE_ENV: production
      HISTORY_WEB_PORT: 5174
    ports:
      - "${HISTORY_WEB_HOST_PORT:-5174}:5174"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  embedding-model-cache:
