services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  embedding-service:
    build:
      context: ./apps/embedding-service
    environment:
      MODEL_REPO: ${EMBEDDING_MODEL_REPO}
      MODEL_FILE: ${EMBEDDING_MODEL_FILE}
      MODEL_NAME: ${EMBEDDING_MODEL_NAME}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      EMBEDDING_BATCH_LIMIT: ${EMBEDDING_BATCH_LIMIT}
      EMBEDDING_MAX_TOKENS: ${EMBEDDING_MAX_TOKENS}
      RERANKER_ENABLED: "${EMBEDDING_RERANKER_ENABLED}"
      RERANKER_MODEL: ${EMBEDDING_RERANKER_MODEL}
      RERANKER_BATCH_LIMIT: ${EMBEDDING_RERANKER_BATCH_LIMIT}
      LLAMA_N_CTX: ${EMBEDDING_LLAMA_N_CTX}
    volumes:
      - embedding-model-cache:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=5)"'
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${API_NODE_ENV}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      LOG_LEVEL: ${API_LOG_LEVEL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      DATA_ENCRYPTION_KEY: ${API_DATA_ENCRYPTION_KEY}
      API_TOKEN_PEPPER: ${API_TOKEN_PEPPER}
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      EMBEDDING_MODEL: ${EMBEDDING_MODEL_NAME}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION}
      RERANKING_ENABLED: "${MEMORY_RERANKING_ENABLED}"
      MEMORY_VECTOR_CANDIDATE_LIMIT: ${MEMORY_VECTOR_CANDIDATE_LIMIT}
      MEMORY_LCM_LEAF_EVENT_THRESHOLD: ${MEMORY_LCM_LEAF_EVENT_THRESHOLD}
      MEMORY_LCM_LEAF_TOKEN_THRESHOLD: ${MEMORY_LCM_LEAF_TOKEN_THRESHOLD}
      MEMORY_LCM_FRESH_EVENT_TAIL: ${MEMORY_LCM_FRESH_EVENT_TAIL}
      MEMORY_LCM_DEPTH1_FANOUT: ${MEMORY_LCM_DEPTH1_FANOUT}
      REQUEST_BODY_LIMIT_BYTES: ${API_REQUEST_BODY_LIMIT_BYTES}
      AUTH_RATE_LIMIT_WINDOW_MS: ${API_AUTH_RATE_LIMIT_WINDOW_MS}
      AUTH_RATE_LIMIT_MAX: ${API_AUTH_RATE_LIMIT_MAX}
      MEMORY_RATE_LIMIT_WINDOW_MS: ${API_MEMORY_RATE_LIMIT_WINDOW_MS}
      MEMORY_RATE_LIMIT_MAX: ${API_MEMORY_RATE_LIMIT_MAX}
      MEMORY_READ_RATE_LIMIT_WINDOW_MS: ${API_MEMORY_READ_RATE_LIMIT_WINDOW_MS}
      MEMORY_READ_RATE_LIMIT_MAX: ${API_MEMORY_READ_RATE_LIMIT_MAX}
      MEMORY_WRITE_RATE_LIMIT_WINDOW_MS: ${API_MEMORY_WRITE_RATE_LIMIT_WINDOW_MS}
      MEMORY_WRITE_RATE_LIMIT_MAX: ${API_MEMORY_WRITE_RATE_LIMIT_MAX}
      MEMORY_RECALL_RATE_LIMIT_WINDOW_MS: ${API_MEMORY_RECALL_RATE_LIMIT_WINDOW_MS}
      MEMORY_RECALL_RATE_LIMIT_MAX: ${API_MEMORY_RECALL_RATE_LIMIT_MAX}
      COOKIE_SECURE: "${API_COOKIE_SECURE}"
      CORS_ORIGINS: ${API_CORS_ORIGINS}
    command: >
      sh -c "cd packages/db &&
      node node_modules/node-pg-migrate/bin/node-pg-migrate.js up --migrations-dir src/migrations --migrations-table schema_migrations &&
      cd /app &&
      node apps/api/dist/index.js"
    ports:
      - "${API_HOST_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: ${WORKER_NODE_ENV}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      DATA_ENCRYPTION_KEY: ${API_DATA_ENCRYPTION_KEY}
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      EMBEDDING_MODEL: ${EMBEDDING_MODEL_NAME}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION}
      RERANKING_ENABLED: "${MEMORY_RERANKING_ENABLED}"
      MEMORY_VECTOR_CANDIDATE_LIMIT: ${MEMORY_VECTOR_CANDIDATE_LIMIT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
      args:
        VITE_API_BASE_URL: ${CONSOLE_API_BASE_URL}
    environment:
      NODE_ENV: ${CONSOLE_NODE_ENV}
      WEB_PORT: ${CONSOLE_PORT}
    ports:
      - "${CONSOLE_HOST_PORT}:5173"
    depends_on:
      api:
        condition: service_started

  history-browser:
    build:
      context: .
      dockerfile: apps/history-browser/Dockerfile
      args:
        VITE_API_BASE_URL: ${CONSOLE_API_BASE_URL}
        HISTORY_BROWSER_REPO: ${HISTORY_BROWSER_REPO:-https://github.com/koed-labs/koed-history-browser.git}
        HISTORY_BROWSER_REF: ${HISTORY_BROWSER_REF:-main}
      secrets:
        - github_token
    environment:
      NODE_ENV: ${CONSOLE_NODE_ENV}
      HISTORY_WEB_PORT: 5174
    ports:
      - "${HISTORY_WEB_HOST_PORT}:5174"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  embedding-model-cache:

secrets:
  github_token:
    environment: GITHUB_TOKEN
