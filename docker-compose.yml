services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  embedding-service:
    build:
      context: ./apps/embedding-service
    environment:
      MODEL_KEY: ${EMBEDDING_MODEL_KEY}
      EMBEDDING_BATCH_LIMIT: ${EMBEDDING_BATCH_LIMIT}
      EMBEDDING_MAX_TOKENS: ${EMBEDDING_MAX_TOKENS}
      EMBEDDING_MAX_TEXT_CHARS: ${EMBEDDING_MAX_TEXT_CHARS}
      EMBEDDING_MAX_REQUEST_CHARS: ${EMBEDDING_MAX_REQUEST_CHARS}
      EMBEDDING_SERVICE_TOKEN: ${EMBEDDING_SERVICE_TOKEN}
      LOG_LEVEL: ${EMBEDDING_LOG_LEVEL}
      RERANKER_KEY: ${EMBEDDING_RERANKER_KEY}
      RERANKER_BATCH_LIMIT: ${EMBEDDING_RERANKER_BATCH_LIMIT}
      LLAMA_N_CTX: ${EMBEDDING_LLAMA_N_CTX}
      LLAMA_N_THREADS: ${EMBEDDING_LLAMA_N_THREADS}
      LLAMA_N_BATCH: ${EMBEDDING_LLAMA_N_BATCH}
      LLAMA_BATCH_TOKEN_HEADROOM: ${EMBEDDING_LLAMA_BATCH_TOKEN_HEADROOM:-8}
      LLAMA_N_UBATCH: ${EMBEDDING_LLAMA_N_UBATCH}
      LLAMA_PARALLEL: ${EMBEDDING_LLAMA_PARALLEL}
      LLAMA_SERVER_BINARY: ${EMBEDDING_LLAMA_SERVER_BINARY:-/opt/llama.cpp/llama-server}
      LLAMA_SERVER_STARTUP_TIMEOUT_SECONDS: ${EMBEDDING_LLAMA_SERVER_STARTUP_TIMEOUT_SECONDS}
      LLAMA_EMBEDDING_SERVER_PORT: ${EMBEDDING_LLAMA_EMBEDDING_SERVER_PORT}
      RERANKER_MODEL_PATH: ${EMBEDDING_RERANKER_MODEL_PATH}
      LLAMA_RERANKER_SERVER_PORT: ${EMBEDDING_LLAMA_RERANKER_SERVER_PORT}
      RERANKER_CONTEXT_PER_SLOT: ${EMBEDDING_RERANKER_CONTEXT_PER_SLOT:-8192}
      RERANKER_LLAMA_N_CTX: ${EMBEDDING_RERANKER_LLAMA_N_CTX:-}
      RERANKER_LLAMA_N_THREADS: ${EMBEDDING_RERANKER_LLAMA_N_THREADS:-}
      RERANKER_LLAMA_N_BATCH: ${EMBEDDING_RERANKER_LLAMA_N_BATCH:-8192}
      RERANKER_LLAMA_N_UBATCH: ${EMBEDDING_RERANKER_LLAMA_N_UBATCH:-8192}
      RERANKER_PARALLEL: ${EMBEDDING_RERANKER_PARALLEL:-4}
      RERANKER_PROMPT_CACHE_ENABLED: ${EMBEDDING_RERANKER_PROMPT_CACHE_ENABLED:-true}
    volumes:
      - embedding-model-cache:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=5)"'
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${API_NODE_ENV}
      LOG_LEVEL: ${API_LOG_LEVEL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      DATA_ENCRYPTION_KEY: ${API_DATA_ENCRYPTION_KEY}
      API_TOKEN_PEPPER: ${API_TOKEN_PEPPER}
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      EMBEDDING_SERVICE_TOKEN: ${EMBEDDING_SERVICE_TOKEN}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL_KEY}
      RERANKER_KEY: ${EMBEDDING_RERANKER_KEY}
      MEMORY_VECTOR_CANDIDATE_LIMIT: ${MEMORY_VECTOR_CANDIDATE_LIMIT}
      MEMORY_RAG_ROLLUP_CANDIDATE_LIMIT: ${MEMORY_RAG_ROLLUP_CANDIDATE_LIMIT}
      MEMORY_RAG_LEAF_CANDIDATE_LIMIT: ${MEMORY_RAG_LEAF_CANDIDATE_LIMIT}
      MEMORY_RAG_FRESH_EVENT_CANDIDATE_LIMIT: ${MEMORY_RAG_FRESH_EVENT_CANDIDATE_LIMIT}
      MEMORY_RAG_RAW_FALLBACK_CANDIDATE_LIMIT: ${MEMORY_RAG_RAW_FALLBACK_CANDIDATE_LIMIT}
      MEMORY_RAG_LEXICAL_CANDIDATE_LIMIT: ${MEMORY_RAG_LEXICAL_CANDIDATE_LIMIT}
      MEMORY_RAG_ROLLUP_RESULT_LIMIT: ${MEMORY_RAG_ROLLUP_RESULT_LIMIT}
      MEMORY_RAG_SCOPED_LEAF_CANDIDATE_LIMIT: ${MEMORY_RAG_SCOPED_LEAF_CANDIDATE_LIMIT}
      MEMORY_RAG_RAW_FALLBACK_ENABLED: ${MEMORY_RAG_RAW_FALLBACK_ENABLED}
      MEMORY_RAG_ROLLUP_MIN_SCORE: ${MEMORY_RAG_ROLLUP_MIN_SCORE}
      MEMORY_RAG_SCOPED_LEAF_MIN_SCORE: ${MEMORY_RAG_SCOPED_LEAF_MIN_SCORE}
      MEMORY_RAG_LEAF_MIN_SCORE: ${MEMORY_RAG_LEAF_MIN_SCORE}
      MEMORY_RAG_FRESH_EVENT_MIN_SCORE: ${MEMORY_RAG_FRESH_EVENT_MIN_SCORE}
      MEMORY_RAG_RAW_FALLBACK_MIN_SCORE: ${MEMORY_RAG_RAW_FALLBACK_MIN_SCORE}
      MEMORY_EVENT_MAX_TOKENS: ${MEMORY_EVENT_MAX_TOKENS}
      MEMORY_AGENT_TURN_STALE_MS: ${MEMORY_AGENT_TURN_STALE_MS}
      SEMANTIC_MEMORY_REBUILD_DEBOUNCE_MS: ${SEMANTIC_MEMORY_REBUILD_DEBOUNCE_MS}
      MEMORY_LCM_LEAF_EVENT_THRESHOLD: ${MEMORY_LCM_LEAF_EVENT_THRESHOLD}
      MEMORY_LCM_LEAF_TOKEN_THRESHOLD: ${MEMORY_LCM_LEAF_TOKEN_THRESHOLD}
      MEMORY_LCM_FRESH_EVENT_TAIL: ${MEMORY_LCM_FRESH_EVENT_TAIL}
      MEMORY_LCM_DEPTH1_FANOUT: ${MEMORY_LCM_DEPTH1_FANOUT}
      REQUEST_BODY_LIMIT_BYTES: ${API_REQUEST_BODY_LIMIT_BYTES}
      AUTH_RATE_LIMIT_WINDOW_MS: ${API_AUTH_RATE_LIMIT_WINDOW_MS}
      AUTH_RATE_LIMIT_MAX: ${API_AUTH_RATE_LIMIT_MAX}
      MEMORY_RATE_LIMIT_WINDOW_MS: ${API_MEMORY_RATE_LIMIT_WINDOW_MS}
      MEMORY_RATE_LIMIT_MAX: ${API_MEMORY_RATE_LIMIT_MAX}
      MEMORY_READ_RATE_LIMIT_WINDOW_MS: ${API_MEMORY_RATE_LIMIT_WINDOW_MS}
      MEMORY_READ_RATE_LIMIT_MAX: ${API_MEMORY_RATE_LIMIT_MAX}
      MEMORY_WRITE_RATE_LIMIT_WINDOW_MS: ${API_MEMORY_RATE_LIMIT_WINDOW_MS}
      MEMORY_WRITE_RATE_LIMIT_MAX: ${API_MEMORY_WRITE_RATE_LIMIT_MAX}
      MEMORY_RECALL_RATE_LIMIT_WINDOW_MS: ${API_MEMORY_RATE_LIMIT_WINDOW_MS}
      MEMORY_RECALL_RATE_LIMIT_MAX: ${API_MEMORY_RECALL_RATE_LIMIT_MAX}
      RATE_LIMIT_STORE: ${API_RATE_LIMIT_STORE}
      RATE_LIMIT_REDIS_URL: ${API_RATE_LIMIT_REDIS_URL}
      CACHE_STORE: ${API_CACHE_STORE}
      CACHE_REDIS_URL: ${API_CACHE_REDIS_URL}
      GRAPH_CACHE_TTL_SECONDS: ${API_GRAPH_CACHE_TTL_SECONDS}
      GRAPH_UPDATE_DEBOUNCE_MS: ${API_GRAPH_UPDATE_DEBOUNCE_MS}
      MEMORY_EVENT_GRAPH_UPDATE_DEBOUNCE_MS: ${API_MEMORY_EVENT_GRAPH_UPDATE_DEBOUNCE_MS}
      COOKIE_SECURE: "${API_COOKIE_SECURE}"
      CORS_ORIGINS: ${API_CORS_ORIGINS}
    ports:
      - "${API_HOST_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: ${WORKER_NODE_ENV}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      DATA_ENCRYPTION_KEY: ${API_DATA_ENCRYPTION_KEY}
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      EMBEDDING_SERVICE_TOKEN: ${EMBEDDING_SERVICE_TOKEN}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL_KEY}
      RERANKER_KEY: ${EMBEDDING_RERANKER_KEY}
      MEMORY_EVENT_MAX_TOKENS: ${MEMORY_EVENT_MAX_TOKENS}
      MEMORY_AGENT_TURN_STALE_MS: ${MEMORY_AGENT_TURN_STALE_MS}
      SEMANTIC_MEMORY_REBUILD_DEBOUNCE_MS: ${SEMANTIC_MEMORY_REBUILD_DEBOUNCE_MS}
      MEMORY_LCM_LEAF_EVENT_THRESHOLD: ${MEMORY_LCM_LEAF_EVENT_THRESHOLD}
      MEMORY_LCM_LEAF_TOKEN_THRESHOLD: ${MEMORY_LCM_LEAF_TOKEN_THRESHOLD}
      MEMORY_LCM_FRESH_EVENT_TAIL: ${MEMORY_LCM_FRESH_EVENT_TAIL}
      MEMORY_LCM_DEPTH1_FANOUT: ${MEMORY_LCM_DEPTH1_FANOUT}
      MEMORY_RAW_PROJECTION_INTERVAL_MS: ${MEMORY_RAW_PROJECTION_INTERVAL_MS}
      MEMORY_RAW_PROJECTION_BATCH_LIMIT: ${MEMORY_RAW_PROJECTION_BATCH_LIMIT}
      MEMORY_RAW_PROJECTION_ACTOR_LIMIT: ${MEMORY_RAW_PROJECTION_ACTOR_LIMIT}
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL}
      WORKER_LOG_FILE: ${WORKER_LOG_FILE}
      WORKER_LOG_DESTINATION: ${WORKER_LOG_DESTINATION}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding-service:
        condition: service_healthy

  explorer:
    build:
      context: .
      dockerfile: apps/explorer/Dockerfile
      args:
        VITE_KOED_API_BASE_URL: ${EXPLORER_API_BASE_URL:-http://localhost:3000}
    environment:
      NODE_ENV: ${EXPLORER_NODE_ENV:-production}
    ports:
      - "${EXPLORER_WEB_HOST_PORT}:5174"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  embedding-model-cache:
