appId: ai.koed.desktop
productName: Koed
icon: assets/icon.icns
copyright: Copyright © 2026 Koed

asar: true
npmRebuild: false
afterPack: scripts/after-pack.mjs

files:
  - dist-electron/**/*
  - assets/koed-icon.png
  - assets/logo-light-mode.png
  - assets/logo-dark-mode.png
  - assets/koed-trayTemplate.png
  - assets/koed-trayTemplate@2x.png
  - package.json
  - "node_modules/@koed-labs/server/package.json"
  - "node_modules/@koed-labs/server/dist/**/*"
  - "!node_modules/@koed-labs/server/src/**"
  - "!node_modules/@koed-labs/server/**/*.test.ts"
  - "!node_modules/@koed-labs/server/tsconfig.json"
  - "!node_modules/@koed-labs/server/tsconfig.tsbuildinfo"

asarUnpack:
  - dist-electron/koed-server/node-entrypoint-runner.js

extraResources:
  - from: dist
    to: app-dist
    filter:
      - "**/*"
  - from: .koed-runtime
    to: koed-runtime
    filter:
      - "**/*"
      - "!node_modules/**/*"
      - "!privacy-service/**/*"
      - "desktop-bundle-manifest.json"
  - from: .koed-runtime/node_modules
    to: koed-runtime/node_modules
    filter:
      - "**/*"

directories:
  output: release

linux:
  # Derived default (@koed-labs/desktop) is not a valid executable name.
  executableName: koed
  icon: assets/koed-icon.png
  category: Development
  artifactName: "Koed-${version}-${arch}.${ext}"
  target:
    - AppImage

mac:
  minimumSystemVersion: "14.0"
  artifactName: "Koed-${version}-${arch}.${ext}"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  target:
    - dir
    - dmg
    - zip
  category: public.app-category.developer-tools
