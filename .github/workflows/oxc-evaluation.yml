name: Oxc evaluation
on:
  push:
    branches: [eval/oxc-tooling]
    paths: [.github/workflows/oxc-evaluation.yml]
permissions:
  contents: read
jobs:
  measure:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
      - name: Create isolated source snapshots
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,tarfile,io,json,os,platform
          p=pathlib.Path('scratch/oxc-evaluation');p.mkdir(parents=True,exist_ok=True)
          source='f22c4f3bc7b0aaf3c74a2776c00f591c6ea677bf'
          files=subprocess.check_output(['git','ls-tree','-r','--name-only','-z',source]).decode().strip('\0').split('\0')
          (p/'source-files.json').write_text(json.dumps(files))
          data=subprocess.check_output(['git','archive',source])
          for name in ['baseline','candidate']:
           d=p/name;d.mkdir(exist_ok=True)
           with tarfile.open(fileobj=io.BytesIO(data)) as t:t.extractall(d,filter='data')
          (p/'environment.json').write_text(json.dumps({'source':source,'evaluation_head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'runner':os.environ.get('RUNNER_NAME'),'runner_os':os.environ.get('RUNNER_OS'),'runner_arch':os.environ.get('RUNNER_ARCH'),'platform':platform.platform(),'cpu':pathlib.Path('/proc/cpuinfo').read_text(),'memory':pathlib.Path('/proc/meminfo').read_text(),'node':subprocess.check_output(['node','--version']).decode().strip(),'pnpm':subprocess.check_output(['pnpm','--version']).decode().strip(),'memory_method':'Aggregate process-session RSS sampled every 10 ms. No isolated delegated cgroup. Shared pages can be counted in several processes and short peaks can be missed.'},indent=2))
          PY
      - name: Write evaluation programs
        run: |
          cat > scratch/oxc-evaluation/inventory.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { ESLint } from '../../node_modules/eslint/lib/api.js';
          import prettier from '../../node_modules/prettier/index.mjs';
          const root=process.cwd();
          const out=path.resolve(process.argv[2]??'scratch/oxc-evaluation');
          fs.mkdirSync(out,{recursive:true});
          const files=JSON.parse(fs.readFileSync(path.join(out,'source-files.json')));
          const eslint=new ESLint({cwd:root,cache:false});
          const schema=JSON.parse(fs.readFileSync(path.join(out,'tools/node_modules/oxlint/configuration_schema.json')));
          const available=schema.definitions.DummyRuleMap.properties;
          const groups=new Map(), formats=[];
          for(const file of files){
            const info=await prettier.getFileInfo(file,{ignorePath:'.prettierignore',withNodeModules:false});
            if(!info.ignored&&info.inferredParser) formats.push(file);
            if(!/\.(js|mjs|cjs|ts|tsx|jsx|mts|cts)$/.test(file)||await eslint.isPathIgnored(file))continue;
            const c=await eslint.calculateConfigForFile(file);
            if(!c)continue;
            const config={rules:c.rules,globals:c.languageOptions.globals??{},ecmaVersion:c.languageOptions.ecmaVersion,sourceType:c.languageOptions.sourceType,parserOptions:c.languageOptions.parserOptions};
            const key=crypto.createHash('sha256').update(JSON.stringify(config)).digest('hex');
            if(!groups.has(key))groups.set(key,{key,config,files:[]});
            groups.get(key).files.push(file);
          }
          const mapping=[];
          const overrides=[];
          for(const g of groups.values()){
            const rules={};
            for(const [name,options] of Object.entries(g.config.rules)){
              if(!options[0])continue;
              let target=name.startsWith('@typescript-eslint/')?name.replace('@typescript-eslint/','typescript/'):`eslint/${name}`;
              if(['@typescript-eslint/no-array-constructor','@typescript-eslint/no-unused-expressions','@typescript-eslint/no-unused-vars'].includes(name)) target=name.replace('@typescript-eslint/','eslint/');
              const supported=Object.hasOwn(available,target)||Object.hasOwn(available,name)||Object.hasOwn(available,target.replace('eslint/',''));
              mapping.push({group:g.key,rule:name,target,options,supported});
              if(supported)rules[target]=options;
            }
            overrides.push({files:g.files,rules,globals:g.config.globals});
          }
          const inlineGlobals=[];
          for(const file of [...groups.values()].flatMap(g=>g.files)){
            const text=fs.readFileSync(file,'utf8');const found={};
            for(const match of text.matchAll(/\/\*\s*globals?\s+([\s\S]*?)\*\//g)){
              for(const part of match[1].split(',')){const [key,mode]=part.trim().split(/\s*:\s*/);if(key)found[key]=mode==='true'||mode==='writable'?'writable':'readonly';}
            }
            if(Object.keys(found).length){inlineGlobals.push({file,globals:found});overrides.push({files:[file],globals:found});}
          }
          fs.writeFileSync(path.join(out,'inline-globals.json'),JSON.stringify(inlineGlobals,null,2));
          const candidate={plugins:['typescript'],categories:Object.fromEntries(['correctness','suspicious','pedantic','perf','style','restriction','nursery'].map(k=>[k,'off'])),env:{builtin:false,es2022:true},ignorePatterns:(await import('../../eslint.config.js')).default[0].ignores,overrides};
          fs.writeFileSync(path.join(out,'eslint-effective.json'),JSON.stringify([...groups.values()],null,2));
          fs.writeFileSync(path.join(out,'rule-map.json'),JSON.stringify(mapping,null,2));
          fs.writeFileSync(path.join(out,'format-files.json'),JSON.stringify(formats,null,2));
          fs.writeFileSync(path.join(out,'lint-files.json'),JSON.stringify([...groups.values()].flatMap(g=>g.files).sort(),null,2));
          fs.writeFileSync(path.join(out,'oxlint.json'),JSON.stringify(candidate,null,2));
          console.log(JSON.stringify({formatFiles:formats.length,lintFiles:[...groups.values()].reduce((n,g)=>n+g.files.length,0),groups:groups.size,enabledUnique:new Set(mapping.map(x=>x.rule)).size,supportedUnique:new Set(mapping.filter(x=>x.supported).map(x=>x.rule)).size,gaps:[...new Set(mapping.filter(x=>!x.supported).map(x=>x.rule))]},null,2));
          JS
          cat > scratch/oxc-evaluation/measure.py <<'PY'
          import os, sys, json, time, subprocess, pathlib, statistics, hashlib, difflib

          ROOT=pathlib.Path.cwd()
          OUT=ROOT/'scratch/oxc-evaluation'
          SOURCE='f22c4f3bc7b0aaf3c74a2776c00f591c6ea677bf'
          files=json.loads((OUT/'format-files.json').read_text())
          lintfiles=json.loads((OUT/'lint-files.json').read_text())
          env=os.environ.copy()
          env['PATH']=str(OUT/'tools/node_modules/.bin')+os.pathsep+env['PATH']
          env['NODE_OPTIONS']='--max-old-space-size=8192'
          rows=[]

          def run(label,cmd,cwd, measured=True, extra_env=None):
              # A fresh session defines the complete process tree, including Node and Go.
              # Aggregate simultaneous RSS, never a sum of independent process peaks.
              start=time.monotonic(); peak=0; samples=0
              e=env.copy();e.update(extra_env or {})
              with (OUT/(label+'.log')).open('w') as log:
                  p=subprocess.Popen(cmd,cwd=cwd,env=e,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
                  while True:
                      rss=0
                      for proc in pathlib.Path('/proc').iterdir():
                          if not proc.name.isdigit():continue
                          try:
                              stat=(proc/'stat').read_text().rsplit(')',1)[1].split()
                              if int(stat[3])==p.pid:
                                  rss+=int(stat[21])*os.sysconf('SC_PAGE_SIZE')
                          except (FileNotFoundError,ProcessLookupError,PermissionError):pass
                      peak=max(peak,rss);samples+=1
                      if p.poll() is not None:break
                      time.sleep(.01)
                  code=p.wait()
              row=dict(label=label,command=cmd,cwd=str(cwd.relative_to(ROOT)),exit=code,seconds=time.monotonic()-start,peak_mib=peak/1048576,samples=samples,measured=measured)
              rows.append(row)
              (OUT/'measurements.json').write_text(json.dumps(rows,indent=2))
              print(json.dumps({k:v for k,v in row.items() if k not in ['command']}),flush=True)
              return code

          prettier=str(ROOT/'node_modules/.bin/prettier')
          oxfmt=str(OUT/'tools/node_modules/.bin/oxfmt')
          eslint=str(ROOT/'node_modules/.bin/eslint')
          oxlint=str(OUT/'tools/node_modules/.bin/oxlint')

          for name in ['baseline','candidate']:
              d=OUT/name
              subprocess.run(['git','init','--quiet',str(d)],check=True)
              if not (d/'node_modules').exists():
                  (d/'node_modules').symlink_to(ROOT/'node_modules',target_is_directory=True)
              subprocess.run(['git','add','.'],cwd=d,check=True)
              subprocess.run(['git','-c','user.name=Evaluation','-c','user.email=eval@localhost','commit','--quiet','-m','Source snapshot'],cwd=d,check=True)

          (OUT/'candidate/.oxfmtrc.json').write_text((OUT/'oxfmt.json').read_text())
          (OUT/'candidate/.oxlintrc.json').write_text((OUT/'oxlint.json').read_text())
          run('baseline-format-write',[prettier,'--write',*files],OUT/'baseline',False)
          run('candidate-format-write',[oxfmt,'--write','-c','.oxfmtrc.json',*files],OUT/'candidate',False)
          churn=[]
          for f in files:
              a=(OUT/'baseline'/f).read_text();b=(OUT/'candidate'/f).read_text()
              if a==b:continue
              matcher=difflib.SequenceMatcher(None,a.splitlines(),b.splitlines(),autojunk=False)
              added=deleted=0
              for tag,i,j,k,l in matcher.get_opcodes():
                  if tag in ['delete','replace']:deleted+=j-i
                  if tag in ['insert','replace']:added+=l-k
              churn.append(dict(file=f,added=added,deleted=deleted))
          (OUT/'format-churn.json').write_text(json.dumps(churn,indent=2))
          # git directory and setup differences are excluded from the review diff below.
          with (OUT/'formatting-only.diff').open('w') as f:
              for row in churn:
                  name=row['file'];a=(OUT/'baseline'/name).read_text().splitlines(True);b=(OUT/'candidate'/name).read_text().splitlines(True)
                  f.writelines(difflib.unified_diff(a,b,fromfile='a/'+name,tofile='b/'+name))

          fmt={'prettier':([prettier,'--check',*files],OUT/'baseline'),'oxfmt':([oxfmt,'--check','-c','.oxfmtrc.json',*files],OUT/'candidate')}
          for name,(cmd,cwd) in fmt.items():run(name+'-warmup',cmd,cwd,False)
          for name in ['baseline','candidate']:
              run(name+'-lint-warmup',[eslint,'.','--no-cache'],OUT/name,False)
          for i in range(5):
              for name in (['prettier','oxfmt'] if i%2==0 else ['oxfmt','prettier']):
                  cmd,cwd=fmt[name];run(name+'-'+str(i+1),cmd,cwd)
                  snapshot='baseline' if name=='prettier' else 'candidate'
                  run(snapshot+'-lint-'+str(i+1),[eslint,'.','--no-cache'],OUT/snapshot)

          # Compatibility attempts are explicitly excluded from performance evidence.
          run('eslint-diagnostics',[eslint,'.','--no-cache','-f','json','-o',str(OUT/'eslint-diagnostics.json')],OUT/'baseline',False)
          run('oxlint-diagnostics',[oxlint,'--type-aware','--tsconfig','tsconfig.eslint.json','-c','.oxlintrc.json','-f','json'],OUT/'candidate',False)
          run('oxlint-files',[oxlint,'-c','.oxlintrc.json','--debug','files'],OUT/'candidate',False)

          # Complete job: installation is included. Execute all unchanged commands to
          # retain failure evidence, and mark the whole job unsuccessful if any fails.
          static=[]
          for name in ['baseline','candidate']:
              d=OUT/name
              (d/'node_modules').unlink()
              script='''import subprocess,sys,os
          commands=[['pnpm','install','--frozen-lockfile'],*EXTRA,['pnpm','env:sync:check'],['pnpm','docs:adr:check'],FORMAT,['pnpm','lint'],['pnpm','typecheck'],['pnpm','typecheck:test']]
          failed=False
          for command in commands:
           print('COMMAND',command,flush=True)
           code=subprocess.run(command).returncode
           print('EXIT',code,flush=True)
           failed=failed or bool(code)
          sys.exit(1 if failed else 0)
          '''
              command=['pnpm','fmt:check'] if name=='baseline' else [oxfmt,'--check','-c','.oxfmtrc.json',*files]
              script=script.replace('FORMAT',repr(command)).replace('EXTRA',repr([] if name=='baseline' else [['npm','install','--prefix',str(OUT/'static-tools'),'--ignore-scripts','--no-audit','--no-fund','oxfmt@0.75.0']]))
              run(name+'-static-job',[sys.executable,'-c',script],d,True,{'CI':'true'})

          summary={}
          for name in fmt:
              values=[r for r in rows if r['label'].startswith(name+'-') and r['measured']]
              summary[name]={}
              for metric in ['seconds','peak_mib']:
                  nums=[r[metric] for r in values]
                  summary[name][metric]={'median':statistics.median(nums),'min':min(nums),'max':max(nums)}
              summary[name]['successful']=all(r['exit']==0 for r in values)
          summary['churn']={'files':len(churn),'added':sum(r['added'] for r in churn),'deleted':sum(r['deleted'] for r in churn)}
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2),flush=True)
          PY
          cat > scratch/oxc-evaluation/oxfmt.json <<'JSON'
          {
            "semi": true,
            "singleQuote": false,
            "trailingComma": "none",
            "printWidth": 80,
            "sortImports": false,
            "sortPackageJson": false,
            "sortTailwindcss": false
          }
          JSON
      - name: Install baseline and pinned candidates
        run: |
          pnpm install --frozen-lockfile > scratch/oxc-evaluation/setup-install.log 2>&1
          npm install --prefix scratch/oxc-evaluation/tools --ignore-scripts --no-audit --no-fund oxfmt@0.75.0 oxlint@1.90.0 oxlint-tsgolint@7.0.2005 > scratch/oxc-evaluation/setup-tools.log 2>&1
      - name: Export coverage and measure checks
        run: |
          node scratch/oxc-evaluation/inventory.mjs > scratch/oxc-evaluation/inventory-summary.json
          python3 scratch/oxc-evaluation/measure.py
      - name: Retain raw evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oxc-evaluation
          path: |
            scratch/oxc-evaluation/*.json
            scratch/oxc-evaluation/*.log
            scratch/oxc-evaluation/*.diff
            scratch/oxc-evaluation/*.mjs
            scratch/oxc-evaluation/*.py
            scratch/oxc-evaluation/tools/package-lock.json
          retention-days: 14
