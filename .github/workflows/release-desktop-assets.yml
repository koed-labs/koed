name: Recover Desktop release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release name whose source supports safe Desktop recovery
        required: true
        type: string

permissions:
  contents: write

concurrency: recover-desktop-release-${{ inputs.tag }}

jobs:
  recover-desktop-assets:
    name: Recover signed Desktop assets for ${{ inputs.tag }}
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Resolve draft release source
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,targetCommitish)"
          if [ "$(jq -r '.isDraft' <<< "${release}")" != "true" ]; then
            echo "Desktop asset recovery is restricted to draft releases; ${TAG} is not a draft." >&2
            exit 1
          fi
          target_commitish="$(jq -r '.targetCommitish' <<< "${release}")"
          commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${target_commitish}" --jq '.sha')"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Checkout immutable release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ steps.release.outputs.commit }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Verify release version and safe source boundary
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -e "process.stdout.write(require('./packages/koed/package.json').version)")"
          if [ "${TAG}" != "v${version}" ]; then
            echo "Release name ${TAG} does not match the checked-out product version v${version}." >&2
            exit 1
          fi
          if [ ! -f scripts/native-runtime-copy.mjs ]; then
            echo "This release source predates safe Desktop symlink and sealing behavior. Publish a patch release instead." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {
            mkdirSync,
            mkdtempSync,
            readFileSync,
            readlinkSync,
            rmSync,
            symlinkSync,
            writeFileSync
          } from "node:fs";
          import { tmpdir } from "node:os";
          import { resolve } from "node:path";
          import { normalizePackagedSymlinks } from "./apps/desktop/scripts/after-pack.mjs";
          import { copyNativeRuntimeSource } from "./scripts/native-runtime-copy.mjs";

          const sources = JSON.parse(
            readFileSync("scripts/native-runtime/sources.macos-arm64.json", "utf8")
          );
          const procurement = readFileSync(
            "scripts/native-runtime/procure-runtime.mjs",
            "utf8"
          );
          if (
            sources.openssl?.kind !== "source-static" ||
            !sources.openssl?.sha256 ||
            !procurement.includes("buildMacosOpenSslStatic")
          ) {
            throw new Error(
              "This tag predates the hermetic macOS runtime builder and cannot be backfilled by this workflow. Publish a patch release instead."
            );
          }

          const root = mkdtempSync(resolve(tmpdir(), "koed-recovery-source-"));
          try {
            const source = resolve(root, "source");
            const destination = resolve(root, "destination");
            mkdirSync(source, { recursive: true });
            writeFileSync(resolve(source, "target"), "fixture");
            symlinkSync("target", resolve(source, "link"));
            copyNativeRuntimeSource(source, destination);
            if (readlinkSync(resolve(destination, "link")) !== "target") {
              throw new Error("Native runtime copying does not preserve relative symlinks.");
            }
            symlinkSync("/staging/target", resolve(destination, "absolute-link"));
            try {
              normalizePackagedSymlinks(destination);
              throw new Error("Desktop packaging accepted an absolute symlink.");
            } catch (error) {
              if (!String(error).includes("Packaged app contains an absolute symlink")) {
                throw error;
              }
            }
          } finally {
            rmSync(root, { recursive: true, force: true });
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build koed-server CLI
        run: pnpm --filter @koed/koed-server build

      - name: Build native runtime artifact
        env:
          KOED_NATIVE_RUNTIME_VERSION: ${{ inputs.tag }}
        run: pnpm native-runtime:build:macos-arm64 -- --json

      - name: Extract and validate native runtime artifact
        run: |
          set -euo pipefail
          runtime_root="${RUNNER_TEMP}/koed-native-runtime-recovery"
          mkdir -p "${runtime_root}"
          tarball="$(find dist/native-runtime/macos-arm64 -name 'koed-native-runtime-macos-arm64-*.tar.gz' -print -quit)"
          test -n "${tarball}"
          tar -xzf "${tarball}" -C "${runtime_root}"
          test -d "${runtime_root}/koed-runtime"
          pnpm native-runtime:validate -- --runtime-root "${runtime_root}/koed-runtime" --platform darwin --json

      - name: Select explicitly approved public stable feed config
        run: >-
          node scripts/prepare-desktop-update-config.mjs
          --mode public
          --url https://updates.koed.ai/R2/stable/
          --allow-public-target
          --out apps/desktop/electron-builder.public.yml
          --json

      - name: Require public macOS trust credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required public macOS release secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Build signed and notarized Desktop artifacts
        env:
          KOED_NATIVE_RUNTIME_SOURCE_DIR: ${{ runner.temp }}/koed-native-runtime-recovery/koed-runtime
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          node scripts/package-desktop-update-artifacts.mjs
          --config apps/desktop/electron-builder.public.yml
          --public-release
          --json

      - name: Validate packaged app public feed selection
        run: >-
          node scripts/validate-desktop-update-feed-selection.mjs
          --app apps/desktop/release/mac/Koed.app
          --mode public
          --json

      - name: Validate Desktop updater artifact set
        env:
          TAG: ${{ inputs.tag }}
        run: >-
          node scripts/validate-desktop-update-artifacts.mjs
          --root apps/desktop/release
          --version "${TAG#v}"
          --json

      - name: Verify Desktop artifact code integrity
        run: cd apps/desktop && node scripts/verify-macos-package.mjs --app release/mac/Koed.app --dmg release/Koed-*-arm64.dmg

      - name: Notarize and staple Desktop DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg="$(find apps/desktop/release -maxdepth 1 -name 'Koed-*-arm64.dmg' -print -quit)"
          test -n "${dmg}"
          xcrun notarytool submit "${dmg}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple -v "${dmg}"

      - name: Verify Developer ID, notarization, stapling, and Gatekeeper trust
        run: >-
          node scripts/verify-macos-public-update-package.mjs
          --app apps/desktop/release/mac/Koed.app
          --dmg "$(find apps/desktop/release -maxdepth 1 -name 'Koed-*-arm64.dmg' -print -quit)"
          --json

      - name: Packaged Desktop native smoke
        run: cd apps/desktop && node scripts/smoke-packaged-desktop-app.mjs --json --timeout-ms 420000 --diagnostics-dir "${RUNNER_TEMP}/koed-desktop-smoke-diagnostics"

      - name: Upload packaged Desktop smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koed-desktop-recovery-smoke-diagnostics-${{ inputs.tag }}
          path: ${{ runner.temp }}/koed-desktop-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Generate Desktop artifact checksums
        run: |
          cd apps/desktop/release
          shasum -a 256 Koed-*-arm64.dmg Koed-*-arm64.zip > koed-desktop-macos-arm64.sha256

      - name: Upload recovered signed Desktop assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" --repo "${GITHUB_REPOSITORY}" \
            apps/desktop/release/Koed-*-arm64.dmg \
            apps/desktop/release/Koed-*-arm64.zip \
            apps/desktop/release/Koed-*-arm64.dmg.blockmap \
            apps/desktop/release/Koed-*-arm64.zip.blockmap \
            apps/desktop/release/latest-mac.yml \
            apps/desktop/release/koed-desktop-macos-arm64.sha256 \
            --clobber

      - name: Verify required release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          assets="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          asset_present() {
            local pattern="$1"
            local asset
            while IFS= read -r asset; do
              [[ "${asset}" == ${pattern} ]] && return 0
            done <<< "${assets}"
            return 1
          }
          for pattern in \
            "koed-server-${version}-linux-x64.tar.gz" \
            "koed-server-${version}-linux-x64.tar.gz.sha256" \
            "koed-server-app-runtime-${version}-linux-x64.provenance.json" \
            "koed-server-app-runtime-${version}-linux-x64.manifest.json" \
            "koed-server-${version}-macos-arm64.tar.gz" \
            "koed-server-${version}-macos-arm64.tar.gz.sha256" \
            "koed-server-app-runtime-${version}-macos-arm64.provenance.json" \
            "koed-server-app-runtime-${version}-macos-arm64.manifest.json" \
            "koed-release-artifacts-${version}.json" \
            'Koed-*-arm64.dmg' \
            'Koed-*-arm64.zip' \
            'Koed-*-arm64.dmg.blockmap' \
            'Koed-*-arm64.zip.blockmap' \
            'latest-mac.yml' \
            'koed-desktop-macos-arm64.sha256'; do
            if ! asset_present "${pattern}"; then
              echo "Missing required release asset: ${pattern}" >&2
              exit 1
            fi
          done

      - name: Promote recovered Desktop updater feed to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.KOED_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.KOED_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.KOED_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.KOED_R2_BUCKET }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required R2 publication secret: ${name}" >&2
              exit 1
            fi
          done
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          version="${TAG#v}"
          root="apps/desktop/release"
          candidate="R2/candidates/${version}/macos-arm64"
          stable="R2/stable"
          for path in "${root}"/Koed-*-arm64.dmg "${root}"/Koed-*-arm64.zip "${root}"/*.blockmap "${root}"/koed-desktop-macos-arm64.sha256; do
            name="$(basename "${path}")"
            aws s3 cp "${path}" "s3://${R2_BUCKET}/${candidate}/${name}" --endpoint-url "${endpoint}" --only-show-errors
            aws s3 cp "${path}" "s3://${R2_BUCKET}/${stable}/${name}" --endpoint-url "${endpoint}" --only-show-errors
          done
          aws s3 cp "${root}/latest-mac.yml" "s3://${R2_BUCKET}/${candidate}/latest-mac.yml" --endpoint-url "${endpoint}" --only-show-errors
          aws s3 cp "${root}/latest-mac.yml" "s3://${R2_BUCKET}/${stable}/latest-mac.yml" \
            --endpoint-url "${endpoint}" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/yaml" \
            --only-show-errors
          aws s3api head-object --bucket "${R2_BUCKET}" --key "${stable}/latest-mac.yml" --endpoint-url "${endpoint}" >/dev/null

      - name: Verify public Desktop updater feed
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          manifest="$(curl --fail --silent --show-error --retry 8 --retry-all-errors https://updates.koed.ai/R2/stable/latest-mac.yml)"
          grep -Eq "^version: ['\"]?${version}['\"]?$" <<< "${manifest}"
          while IFS= read -r artifact; do
            curl --fail --silent --show-error --retry 8 --retry-all-errors --head "https://updates.koed.ai/R2/stable/${artifact}" >/dev/null
          done < <(printf '%s\n' "${manifest}" | sed -nE 's/^[[:space:]]*(- url:|path:)[[:space:]]+([^[:space:]]+).*$/\2/p' | sort -u)

      - name: Publish recovered release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          fi
