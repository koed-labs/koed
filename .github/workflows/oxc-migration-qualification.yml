name: Combined Oxfmt and Oxlint qualification
on:
  push:
    branches:
      - eval/oxc-tooling
    paths:
      - .github/workflows/oxc-migration-qualification.yml
      - .github/workflows/ci.yml
      - .oxlintrc.json
      - .oxfmtrc.json
      - package.json
      - pnpm-lock.yaml
      - scripts/oxlint-*.mjs
      - apps/api/src/auth/remote-mcp-oauth-routes.ts
      - apps/api/src/managed-conversations/routes.ts
      - tsconfig*.json
      - apps/desktop/tsconfig*.json
      - packages/mcp-server/tests/tsconfig.json
permissions:
  contents: read
jobs:
  qualification:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: koed
          POSTGRES_USER: koed
          POSTGRES_PASSWORD: koed
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U koed -d koed" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
      - name: Prepare original ESLint control
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,tarfile,io,json
          p=pathlib.Path('scratch/oxc-migration');p.mkdir(parents=True,exist_ok=True)
          source='f22c4f3bc7b0aaf3c74a2776c00f591c6ea677bf'
          (p/'source-files.json').write_text(json.dumps(subprocess.check_output(['git','ls-tree','-r','--name-only','-z',source]).decode().strip('\0').split('\0')))
          b=p/'baseline';b.mkdir(parents=True,exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(subprocess.check_output(['git','archive',source])))as t:t.extractall(b,filter='data')
          subprocess.run(['git','init','--quiet',str(b)],check=True)
          (p/'results').mkdir(parents=True,exist_ok=True)
          (p/'results/environment.json').write_text(json.dumps({'source':source,'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'node':subprocess.check_output(['node','--version']).decode().strip(),'pnpm':subprocess.check_output(['pnpm','--version']).decode().strip()},indent=2))
          PY
      - name: Install candidate and complete baseline dependencies
        run: |
          pnpm install --frozen-lockfile > scratch/oxc-migration/results/candidate-install.log 2>&1
          pnpm --dir scratch/oxc-migration/baseline install --frozen-lockfile > scratch/oxc-migration/results/baseline-install.log 2>&1
      - name: Validate combined migration and retained checks
        run: |
          pnpm fmt:check
          pnpm lint
          pnpm typecheck:test
          pnpm exec tsc -p apps/desktop/tsconfig.electron.json --noEmit
          pnpm exec tsc -p apps/api/tsconfig.browser.json --noEmit
          node --test scripts/oxlint-compatibility.test.mjs
      - name: Exercise OAuth and terminal routes
        env:
          KOED_OAUTH_TEST_DATABASE_URL: postgres://koed:koed@127.0.0.1:5432/koed
        run: |
          pnpm --filter @koed-labs/server build > scratch/oxc-migration/results/server-test-build.log 2>&1
          pnpm exec vitest run apps/api/src/auth/remote-mcp-oauth-routes.test.ts apps/api/src/managed-conversations/routes.test.ts --reporter=json --outputFile=scratch/oxc-migration/results/routes-tests.json
      - name: Verify complete typed source coverage
        run: |
          cat > scratch/oxc-migration/coverage.mjs <<'JS'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import {spawnSync}from'node:child_process';
          const root=process.cwd(),base=path.resolve('scratch/oxc-migration/baseline'),out=path.resolve('scratch/oxc-migration/results');fs.mkdirSync(out,{recursive:true});
          const {ESLint}=await import(path.join(base,'node_modules/eslint/lib/api.js'));const eslint=new ESLint({cwd:base,cache:false});
          const original=JSON.parse(fs.readFileSync('scratch/oxc-migration/source-files.json')),lint=[],typed=[];
          for(const f of original){if(!/\.(?:js|mjs|cjs|ts|tsx|jsx|mts|cts)$/.test(f)||await eslint.isPathIgnored(f))continue;const c=await eslint.calculateConfigForFile(f);if(!c)continue;lint.push(f);if(c.rules['@typescript-eslint/no-floating-promises']?.[0]===2&&!/\.d\.ts$/.test(f))typed.push(f);}
          if(lint.length!==2055||typed.length!==1754)throw Error('Baseline scope changed');
          const removed=lint.filter(f=>!fs.existsSync(f));if(JSON.stringify(removed)!==JSON.stringify(['eslint.config.js']))throw Error('Unexpected lint source removal: '+removed);
          fs.writeFileSync(path.join(out,'baseline-lint-files.json'),JSON.stringify(lint,null,2));
          const contents=new Map();let data;
          try{for(const f of typed){const bytes=fs.readFileSync(f);contents.set(f,bytes);fs.writeFileSync(f,Buffer.concat([bytes,Buffer.from('\nglobalThis.Promise.resolve("__oxc_migration_typed_probe__");\n')]));}
          const r=spawnSync(path.resolve('node_modules/.bin/oxlint'),['-f','json','.'],{encoding:'utf8',maxBuffer:256*1024*1024,env:process.env});fs.writeFileSync(path.join(out,'typed-coverage.json'),r.stdout??'');fs.writeFileSync(path.join(out,'typed-coverage.stderr'),r.stderr??'');if(r.error||r.signal)throw r.error??Error(r.signal);data=JSON.parse(r.stdout);
          }finally{for(const[f,b]of contents)fs.writeFileSync(f,b);}
          const seen=new Set(data.diagnostics.filter(d=>d.code==='typescript(no-floating-promises)'&&contents.has(d.filename)&&d.labels?.some(l=>l.span?.offset>=contents.get(d.filename).byteLength)).map(d=>d.filename));
          const missing=typed.filter(f=>!seen.has(f));if(missing.length)throw Error('Typed probes missed: '+missing);for(const[f,b]of contents)if(!fs.readFileSync(f).equals(b))throw Error('Unrestored probe '+f);
          const summary={baselineLintFiles:lint.length,removedTooling:removed,sharedSourceFiles:lint.length-removed.length,candidateFiles:data.number_of_files,typedProbes:typed.length,detected:seen.size,missing,restored:true};fs.writeFileSync(path.join(out,'coverage-summary.json'),JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));

          JS
          node scratch/oxc-migration/coverage.mjs
      - name: Measure incremental lint gain and complete static jobs
        run: |
          cat > scratch/oxc-migration/benchmark.py <<'PY'
          import os,sys,json,pathlib,subprocess,time,statistics,shutil
          root=pathlib.Path.cwd();base=root/'scratch/oxc-migration/baseline';out=root/'scratch/oxc-migration/results';out.mkdir(parents=True,exist_ok=True)
          env={**os.environ,'NODE_OPTIONS':'--max-old-space-size=8192','CI':'true'};rows=[]
          def run(label,cmd,cwd,measured=True):
           start=time.monotonic();peak=0;samples=0
           with (out/(label+'.log')).open('w')as log:
            p=subprocess.Popen(cmd,cwd=cwd,env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
            while True:
             rss=0
             for proc in pathlib.Path('/proc').iterdir():
              if not proc.name.isdigit():continue
              try:
               st=(proc/'stat').read_text().rsplit(')',1)[1].split()
               if int(st[3])==p.pid:rss+=int(st[21])*os.sysconf('SC_PAGE_SIZE')
              except(FileNotFoundError,ProcessLookupError,PermissionError):pass
             peak=max(peak,rss);samples+=1
             if p.poll()is not None:break
             time.sleep(.01)
            code=p.wait()
           row={'label':label,'command':cmd,'cwd':str(cwd),'exit':code,'seconds':time.monotonic()-start,'peak_mib':peak/1048576,'samples':samples,'measured':measured};rows.append(row);(out/'measurements.json').write_text(json.dumps(rows,indent=2));print(json.dumps(row),flush=True)
           if code:raise RuntimeError('Failed command '+label)
           return row
          oxfmt=str(root/'node_modules/.bin/oxfmt');oxlint=str(root/'node_modules/.bin/oxlint');eslint=str(base/'node_modules/.bin/eslint')
          # Preserve the original baseline for the complete-job comparison, then measure
          # an Oxfmt + unchanged ESLint control to isolate the incremental Oxlint gain.
          original=json.loads((root/'scratch/oxc-migration/source-files.json').read_text())
          run('control-production-prepare',['pnpm','typecheck'],base,False)
          run('control-eslint-clean',[eslint,'.','--no-cache'],base,False)
          (base/'.oxfmtrc.json').write_text((root/'.oxfmtrc.json').read_text())
          run('control-oxfmt-write',[oxfmt,'--write','.'],base,False)
          commands={'control-format':([oxfmt,'--check','.'],base),'candidate-format':([oxfmt,'--check','.'],root),'control-lint':([eslint,'.','--no-cache'],base),'candidate-lint':([oxlint,'.'],root)}
          for label,(cmd,cwd)in commands.items():run(label+'-warmup',cmd,cwd,False)
          for i in range(5):
           for side in (['control','candidate']if i%2==0 else['candidate','control']):
            for kind in ['format','lint']:
             cmd,cwd=commands[side+'-'+kind];run(side+'-'+kind+'-'+str(i+1),cmd,cwd)
          # Restore the baseline to its authored Prettier source before full-job timing.
          archive=subprocess.check_output(['git','archive','f22c4f3bc7b0aaf3c74a2776c00f591c6ea677bf']);import tarfile,io
          with tarfile.open(fileobj=io.BytesIO(archive))as t:t.extractall(base,filter='data')
          (base/'.oxfmtrc.json').unlink()
          for side,cwd in [('baseline',base),('candidate',root)]:
           for p in [cwd/'node_modules',*cwd.glob('apps/*/node_modules'),*cwd.glob('packages/*/node_modules')]:
            if p.is_symlink():p.unlink()
            elif p.exists():shutil.rmtree(p)
           # Remove emitted build state so both sequences include the required production
           # declaration build. No dependency or compiler check is omitted.
           for p in cwd.glob('**/tsconfig*.tsbuildinfo'):
            if 'node_modules'not in p.parts and not(side=='candidate'and'scratch'in p.relative_to(cwd).parts):p.unlink()
           steps=[['pnpm','install','--frozen-lockfile'],['pnpm','env:sync:check'],['pnpm','docs:adr:check'],['pnpm','fmt:check'],['pnpm','lint']]
           if side=='baseline':steps.append(['pnpm','typecheck'])
           steps.extend([['pnpm','typecheck:test'],['pnpm','exec','tsc','-p','apps/desktop/tsconfig.electron.json','--noEmit'],['pnpm','exec','tsc','-p','apps/api/tsconfig.browser.json','--noEmit']])
           code="import subprocess,sys\ncommands="+repr(steps)+"\nfor c in commands:\n print('COMMAND',c,flush=True)\n r=subprocess.run(c)\n if r.returncode:sys.exit(r.returncode)\n"
           run(side+'-complete-job',[sys.executable,'-c',code],cwd)
          summary={}
          for side in ['control','candidate']:
           pairs=[]
           for i in range(1,6):
            a=next(r for r in rows if r['label']==side+'-format-'+str(i));b=next(r for r in rows if r['label']==side+'-lint-'+str(i));pairs.append({'seconds':a['seconds']+b['seconds'],'peak_mib':max(a['peak_mib'],b['peak_mib'])})
           summary[side]={k:{'median':statistics.median([r[k]for r in pairs]),'min':min(r[k]for r in pairs),'max':max(r[k]for r in pairs)}for k in ['seconds','peak_mib']}
          summary['incrementalReduction']={k:1-summary['candidate'][k]['median']/summary['control'][k]['median']for k in ['seconds','peak_mib']}
          summary['completeJobs']={side:next(r for r in rows if r['label']==side+'-complete-job')for side in ['baseline','candidate']}
          (out/'benchmark-summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2))

          PY
          python3 scratch/oxc-migration/benchmark.py
      - name: Retain migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oxc-migration-qualification
          path: |-
            scratch/oxc-migration/results/
            scratch/oxc-migration/coverage.mjs
            scratch/oxc-migration/benchmark.py
          retention-days: 14
    env:
      NODE_OPTIONS: --max-old-space-size=8192
