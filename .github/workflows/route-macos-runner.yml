name: Route macOS runner

on:
  workflow_call:
    secrets:
      KOED_RUNNER_STATUS_TOKEN:
        required: false
    outputs:
      runner:
        description: JSON runner label or label array
        value: ${{ jobs.route.outputs.runner }}

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - id: route
        run: node scripts/macos-runner-routing.mjs
        env:
          KOED_RUNNER_STATUS_TOKEN: ${{ secrets.KOED_RUNNER_STATUS_TOKEN }}
