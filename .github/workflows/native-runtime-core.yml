name: Independent Linux CPU core

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-runtime-core.yml
      - scripts/native-runtime/core.linux-x64.json
      - scripts/native-runtime/sources.linux-x64.json
      - scripts/native-runtime/build-core-linux-x64.mjs
      - scripts/native-runtime/core-artifact.mjs
      - scripts/native-runtime/qualify-core-linux-x64.mjs
      - scripts/native-runtime/package-core-qualification.mjs
      - scripts/native-runtime/publish-core.mjs
      - scripts/native-runtime/procure-runtime.mjs
      - scripts/native-runtime/content-policy.mjs
      - scripts/native-runtime/manifest-lib.mjs
      - scripts/native-runtime/loader-validation-lib.mjs
      - scripts/deterministic-tar-gzip.mjs
      - packages/koed-server/src/artifact-canonical-json.mjs
      - config/release-artifact-size-policy.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-native-core
  cancel-in-progress: false

env:
  NODE_VERSION: 24.13.1
  EMBEDDING_MODEL_SHA256: 06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439

jobs:
  candidate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      candidate_sha256: ${{ steps.identity.outputs.candidate_sha256 }}
      qualification_sha256: ${{ steps.identity.outputs.qualification_sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install CPU build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libssl-dev curl ca-certificates patchelf
      - name: Build independent CPU core
        run: |
          mkdir -p scratch
          node scripts/native-runtime/build-core-linux-x64.mjs --out-dir scratch/native-core --json > scratch/core-build.log
      - name: Inspect the exact core archive
        run: |
          node scripts/inspect-release-artifact.mjs \
            --path scratch/native-core/koed-native-core-*.tar.gz \
            --platform linux --arch x64 \
            --policy config/release-artifact-size-policy.json \
            --baseline config/release-artifact-baseline-v0.6.2.json \
            --out scratch/core-artifact-policy.json --json
      - name: Restore qualification model
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: scratch/models/Qwen3-Embedding-0.6B-Q8_0.gguf
          key: native-core-model-${{ env.EMBEDDING_MODEL_SHA256 }}
      - name: Fetch only a missing qualification model and verify its digest
        run: |
          set -euo pipefail
          model=scratch/models/Qwen3-Embedding-0.6B-Q8_0.gguf
          mkdir -p scratch/models
          if [ ! -f "${model}" ]; then
            curl --fail --location --retry 3 --max-time 600 \
              --output "${model}.partial" \
              https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
            mv "${model}.partial" "${model}"
          fi
          echo "${EMBEDDING_MODEL_SHA256}  ${model}" | sha256sum --check --strict
      - name: Qualify the extracted CPU archive
        run: |
          set -euo pipefail
          (cd scratch/native-core && sha256sum --check --strict koed-native-core-*.tar.gz.sha256)
          mkdir scratch/extracted-core
          tar -xzf scratch/native-core/koed-native-core-*.tar.gz -C scratch/extracted-core
          node scripts/native-runtime/qualify-core-linux-x64.mjs \
            --runtime-root scratch/extracted-core/koed-runtime \
            --model-path scratch/models/Qwen3-Embedding-0.6B-Q8_0.gguf \
            --out-dir scratch/core-evidence
          cp scratch/core-evidence/qualification.json scratch/native-core/qualification.json
      - name: Prepare offline qualification handover and verify identical repackaging
        run: |
          node scripts/native-runtime/package-core-qualification.mjs \
            --candidate-dir scratch/native-core --out-dir scratch/core-handover
          node scripts/native-runtime/publish-core.mjs --candidate-dir scratch/native-core > scratch/core-publication-review.json
      - name: Bind the reviewed candidate and qualification
        id: identity
        run: |
          set -euo pipefail
          echo "candidate_sha256=$(sha256sum scratch/native-core/core-candidate.json | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
          echo "qualification_sha256=$(sha256sum scratch/native-core/qualification.json | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
          cat scratch/core-publication-review.json >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: native-core-candidate-${{ github.sha }}
          path: |
            scratch/native-core/*.tar.gz
            scratch/native-core/*.sha256
            scratch/native-core/core-candidate.json
            scratch/native-core/qualification.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-core-handover-evidence-${{ github.sha }}
          path: |
            scratch/core-handover/*.tar.gz
            scratch/core-handover/*.sha256
            scratch/core-evidence/*.json
            scratch/core-evidence/*.log
            scratch/core-artifact-policy.json
            scratch/core-build.log
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Retain reviewed CPU core
    needs: candidate
    environment: production
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          path: scratch/native-core
          merge-multiple: true
      - name: Authenticate the protected build outputs before extraction
        env:
          CANDIDATE_SHA256: ${{ needs.candidate.outputs.candidate_sha256 }}
          QUALIFICATION_SHA256: ${{ needs.candidate.outputs.qualification_sha256 }}
        run: |
          set -euo pipefail
          echo "${CANDIDATE_SHA256}  scratch/native-core/core-candidate.json" | sha256sum --check --strict
          echo "${QUALIFICATION_SHA256}  scratch/native-core/qualification.json" | sha256sum --check --strict
          node --input-type=module <<'JS'
          import { readFileSync, lstatSync } from 'node:fs';
          import { sha256File } from './scripts/native-runtime/manifest-lib.mjs';
          const pin = JSON.parse(readFileSync('scratch/native-core/core-candidate.json', 'utf8'));
          if (!/^koed-native-core-[a-f0-9]{64}-linux-x64\.tar\.gz$/.test(pin.archive)) throw new Error('Invalid candidate archive name.');
          const file = `scratch/native-core/${pin.archive}`;
          if (lstatSync(file).size !== pin.archiveBytes || sha256File(file) !== pin.sha256) throw new Error('Candidate archive differs from the protected build.');
          JS
          tar -xzf scratch/native-core/koed-native-core-*.tar.gz -C scratch/native-core
      - name: Require independent approval and publish without replacement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/native-runtime/publish-core.mjs --candidate-dir scratch/native-core --publish
