name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version and Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      desktop_assets_enabled: ${{ steps.release_assets.outputs.enabled }}
      tag: ${{ steps.product.outputs.tag }}
      version: ${{ steps.product.outputs.version }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: koed
          POSTGRES_USER: koed
          POSTGRES_PASSWORD: koed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koed -d koed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release pull request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          version: pnpm release:version
          title: Version Koed
          commit: "ci: version koed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read product version
        id: product
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          version="$(node -e "const fs = require('node:fs'); process.stdout.write(JSON.parse(fs.readFileSync('packages/koed/package.json', 'utf8')).version)")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Check GitHub release
        id: release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.product.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify release commit
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.release.outputs.exists == 'false'
        env:
          DATABASE_URL: postgres://koed:koed@127.0.0.1:5432/koed
          KOED_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PG_DUMP_BIN: .github/scripts/pg-dump-service.sh
          PG_RESTORE_BIN: .github/scripts/pg-restore-service.sh
        run: pnpm verify

      - name: Create release notes
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.release.outputs.exists == 'false'
        run: pnpm release:notes > release-notes.md

      - name: Append release artifact notes
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.release.outputs.exists == 'false'
        run: |
          cat >> release-notes.md <<'EOF'

          ## Release artifact lines

          - Desktop package: Koed Desktop control-plane assets.
          - koed-server app-runtime package: standalone JS/service runtime archives named `koed-server-<version>-<platform>-<arch>.tar.gz` with SHA-256 sidecars.
          - Native runtime assets: separate, checksum-pinned Postgres, pgvector, and llama-server runtime archives. Linux x64 includes CPU and CUDA payloads; models remain separate.
          - Model artifacts: separate embedding and reranker assets installed under `KOED_HOME/models`; not embedded in the koed-server app-runtime package.
          EOF

      - name: Mark Desktop release assets enabled
        id: release_assets
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          if [ "${{ steps.release.outputs.exists }}" = "false" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create GitHub release
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.product.outputs.tag }}" \
            --title "Koed ${{ steps.product.outputs.tag }}" \
            --target "${GITHUB_SHA}" \
            --draft \
            --notes-file release-notes.md

  standalone-koed-server-release-assets:
    name: Standalone koed-server release assets (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: release
    if: needs.release.outputs.desktop_assets_enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
          - platform: macos
            arch: arm64
            runner: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        run: pnpm build

      - name: Build standalone koed-server package
        env:
          SOURCE_DATE_EPOCH: 0
        run: pnpm koed-server:package -- --version "${{ needs.release.outputs.version }}" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --json

      - name: Stage standalone koed-server package assets
        run: |
          set -euo pipefail
          target="${{ matrix.platform }}-${{ matrix.arch }}"
          package_dir="dist/koed-server-package/${target}"
          release_dir="release-artifacts/koed-server-app-runtime-${target}"
          mkdir -p "${release_dir}"
          cp "${package_dir}"/koed-server-*.tar.gz "${release_dir}/"
          cp "${package_dir}"/koed-server-*.tar.gz.sha256 "${release_dir}/"
          cp "${package_dir}"/koed-server-app-runtime-*.provenance.json "${release_dir}/"
          if compgen -G "${package_dir}/koed-server-app-runtime-*.provenance.json.sig" > /dev/null; then
            cp "${package_dir}"/koed-server-app-runtime-*.provenance.json.sig "${release_dir}/"
          fi
          manifest="$(find "${package_dir}" -path '*/koed-server-package-manifest.json' -print -quit)"
          test -n "${manifest}"
          cp "${manifest}" "${release_dir}/koed-server-app-runtime-${{ needs.release.outputs.version }}-${target}.manifest.json"

      - name: Upload standalone koed-server assets to workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koed-server-app-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-artifacts/koed-server-app-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload standalone koed-server assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            release-artifacts/koed-server-app-runtime-${{ matrix.platform }}-${{ matrix.arch }}/* \
            --clobber

  standalone-koed-server-release-metadata:
    name: Standalone koed-server release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - release
      - standalone-koed-server-release-assets
      - native-runtime-linux-x64-release-assets
    if: needs.release.outputs.desktop_assets_enabled == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1

      - name: Download standalone koed-server assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: koed-server-app-runtime-*
          path: release-artifacts
          merge-multiple: true

      - name: Download Linux native runtime assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: koed-native-runtime-linux-x64
          path: release-artifacts/native-runtime-linux-x64

      - name: Write release artifact metadata
        run: |
          node scripts/write-koed-release-artifact-metadata.mjs -- \
            --version "${{ needs.release.outputs.version }}" \
            --tag "${{ needs.release.outputs.tag }}" \
            --repository "${{ github.repository }}" \
            --artifact-root release-artifacts \
            --out "koed-release-artifacts-${{ needs.release.outputs.version }}.json" \
            --json

      - name: Upload release artifact metadata to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            "koed-release-artifacts-${{ needs.release.outputs.version }}.json" \
            --clobber

  native-runtime-linux-x64-release-assets:
    name: Linux x64 native runtime release assets
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: release
    if: needs.release.outputs.desktop_assets_enabled == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build koed-server CLI
        run: pnpm --filter @koed/koed-server build

      - name: Restore verified Linux native runtime payload
        id: native-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/koed-native-runtime-cache/linux-x64/koed-runtime
          key: native-runtime-payload-v1-linux-x64-cuda-12.4-${{ hashFiles('scripts/native-runtime/sources.linux-x64.json', 'scripts/native-runtime/procure-runtime.mjs', 'scripts/native-runtime/manifest-lib.mjs', 'scripts/native-runtime/build-linux-x64.mjs', 'scripts/native-runtime-copy.mjs') }}

      - name: Require prebuilt verified native runtime payload
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          echo "Verified Linux native runtime cache is missing for the current pinned build recipe." >&2
          echo "Run the Linux native runtime cache workflow on main before publishing this release." >&2
          exit 1

      - name: Validate cached native runtime payload
        run: |
          report="${RUNNER_TEMP}/koed-native-runtime-validation.json"
          set +e
          node scripts/native-runtime/validate-runtime.mjs --runtime-root "${RUNNER_TEMP}/koed-native-runtime-cache/linux-x64/koed-runtime" --platform linux --json > "${report}"
          status=$?
          set -e
          jq '{ok, error, errors, timings, postgresExtensions: (.postgresExtensions | {ok, error, log}), packagedProvider: (.packagedProvider | {skipped, ok, status: (.status | {status, stderr}), install: (.install | {status, stderr})})}' "${report}"
          exit "${status}"

      - name: Package native runtime release artifact
        run: pnpm native-runtime:build:linux-x64 -- --source-dir "${RUNNER_TEMP}/koed-native-runtime-cache/linux-x64/koed-runtime" --version "${{ needs.release.outputs.version }}" --json

      - name: Validate packaged native runtime artifact
        run: |
          report="${RUNNER_TEMP}/koed-packaged-native-runtime-validation.json"
          set +e
          node scripts/native-runtime/validate-runtime.mjs --runtime-root dist/native-runtime/linux-x64/koed-runtime --platform linux --json > "${report}"
          status=$?
          set -e
          jq '{ok, error, errors, timings, postgresExtensions: (.postgresExtensions | {ok, error, log}), packagedProvider: (.packagedProvider | {skipped, ok, status: (.status | {status, stderr}), install: (.install | {status, stderr})})}' "${report}"
          exit "${status}"

      - name: Stage native runtime release assets
        run: |
          set -euo pipefail
          release_dir="release-artifacts/native-runtime-linux-x64"
          mkdir -p "${release_dir}"
          cp dist/native-runtime/linux-x64/koed-native-runtime-linux-x64-*.tar.gz "${release_dir}/"
          cp dist/native-runtime/linux-x64/koed-native-runtime-linux-x64-*.tar.gz.sha256 "${release_dir}/"
          cp dist/native-runtime/linux-x64/provenance.json "${release_dir}/koed-native-runtime-linux-x64-${{ needs.release.outputs.version }}.provenance.json"

      - name: Upload native runtime assets to workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koed-native-runtime-linux-x64
          path: release-artifacts/native-runtime-linux-x64
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload native runtime assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            release-artifacts/native-runtime-linux-x64/* \
            --clobber

  unsigned-desktop-release-assets:
    name: Unsigned Desktop release assets
    runs-on: macos-14
    timeout-minutes: 90
    needs: release
    if: needs.release.outputs.desktop_assets_enabled == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build koed-server CLI
        run: pnpm --filter @koed/koed-server build

      - name: Build native runtime artifact
        env:
          KOED_NATIVE_RUNTIME_VERSION: ${{ needs.release.outputs.tag }}
        run: pnpm native-runtime:build:macos-arm64 -- --json

      - name: Extract native runtime artifact for relocation validation
        run: |
          set -euo pipefail
          runtime_root="${RUNNER_TEMP}/koed-native-runtime-release"
          mkdir -p "${runtime_root}"
          tarball="$(find dist/native-runtime/macos-arm64 -name 'koed-native-runtime-macos-arm64-*.tar.gz' -print -quit)"
          test -n "${tarball}"
          tar -xzf "${tarball}" -C "${runtime_root}"
          test -d "${runtime_root}/koed-runtime"

      - name: Validate native runtime artifact
        run: pnpm native-runtime:validate -- --runtime-root "${RUNNER_TEMP}/koed-native-runtime-release/koed-runtime" --platform darwin --json

      - name: Build unsigned Desktop artifacts
        env:
          KOED_NATIVE_RUNTIME_SOURCE_DIR: ${{ runner.temp }}/koed-native-runtime-release/koed-runtime
        run: pnpm desktop:package:internal:mac

      - name: Verify Desktop artifact code integrity
        run: cd apps/desktop && node scripts/verify-macos-package.mjs --app release/mac/Koed.app --dmg release/Koed-*-arm64.dmg

      - name: Packaged Desktop native smoke
        run: cd apps/desktop && node scripts/smoke-packaged-desktop-app.mjs --json --timeout-ms 420000 --diagnostics-dir "${RUNNER_TEMP}/koed-desktop-smoke-diagnostics"

      - name: Upload packaged Desktop smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koed-desktop-release-smoke-diagnostics-${{ needs.release.outputs.tag }}
          path: ${{ runner.temp }}/koed-desktop-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Generate Desktop artifact checksums
        run: |
          cd apps/desktop/release
          shasum -a 256 Koed-*-arm64.dmg Koed-*-arm64.zip > koed-desktop-macos-arm64-unsigned.sha256

      - name: Report release artifact sizes
        run: |
          du -h apps/desktop/release/Koed-*-arm64.dmg apps/desktop/release/Koed-*-arm64.zip
          test "$(find apps/desktop/release -maxdepth 1 -name '*.blockmap' | wc -l | tr -d ' ')" -ge 2
          {
            echo "### Exact release artifact sizes"
            echo '```text'
            du -h apps/desktop/release/Koed-*-arm64.dmg apps/desktop/release/Koed-*-arm64.zip
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload unsigned Desktop assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            apps/desktop/release/Koed-*-arm64.dmg \
            apps/desktop/release/Koed-*-arm64.zip \
            apps/desktop/release/koed-desktop-macos-arm64-unsigned.sha256 \
            --clobber

  publish-release:
    name: Verify assets and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - release
      - standalone-koed-server-release-assets
      - standalone-koed-server-release-metadata
      - native-runtime-linux-x64-release-assets
      - unsigned-desktop-release-assets
    if: needs.release.outputs.desktop_assets_enabled == 'true'

    steps:
      - name: Verify required release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          assets="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          asset_present() {
            local pattern="$1"
            local asset
            while IFS= read -r asset; do
              [[ "${asset}" == ${pattern} ]] && return 0
            done <<< "${assets}"
            return 1
          }
          for pattern in \
            "koed-server-${VERSION}-linux-x64.tar.gz" \
            "koed-server-${VERSION}-linux-x64.tar.gz.sha256" \
            "koed-server-app-runtime-${VERSION}-linux-x64.provenance.json" \
            "koed-server-app-runtime-${VERSION}-linux-x64.manifest.json" \
            "koed-server-${VERSION}-macos-arm64.tar.gz" \
            "koed-server-${VERSION}-macos-arm64.tar.gz.sha256" \
            "koed-server-app-runtime-${VERSION}-macos-arm64.provenance.json" \
            "koed-server-app-runtime-${VERSION}-macos-arm64.manifest.json" \
            "koed-release-artifacts-${VERSION}.json" \
            "koed-native-runtime-linux-x64-${VERSION}.tar.gz" \
            "koed-native-runtime-linux-x64-${VERSION}.tar.gz.sha256" \
            "koed-native-runtime-linux-x64-${VERSION}.provenance.json" \
            'Koed-*-arm64.dmg' \
            'Koed-*-arm64.zip' \
            'koed-desktop-macos-arm64-unsigned.sha256'; do
            if ! asset_present "${pattern}"; then
              echo "Missing required release asset: ${pattern}" >&2
              exit 1
            fi
          done

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release.outputs.tag }}" --repo "${GITHUB_REPOSITORY}" --draft=false
