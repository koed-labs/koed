name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_native_runtime_macos_arm64:
        description: Build macOS arm64 native runtime artifact
        type: boolean
        default: false
      build_native_runtime_linux_x64:
        description: Build Linux x64 native runtime artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Format, Typecheck, Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: koed
          POSTGRES_USER: koed
          POSTGRES_PASSWORD: koed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koed -d koed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check env examples are synced
        run: pnpm env:sync:check

      - name: Check formatting
        run: pnpm fmt:check

      - name: Check DB migration files
        run: pnpm db:migrate:check

      - name: Smoke DB migrations
        env:
          DATABASE_URL: postgres://koed:koed@127.0.0.1:5432/koed
        run: pnpm db:migrate:smoke

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck tests
        run: pnpm typecheck:test

      - name: Test
        env:
          DATABASE_URL: postgres://koed:koed@127.0.0.1:5432/koed
          REDIS_URL: redis://127.0.0.1:6379
        run: pnpm test

  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  standalone-koed-server-package:
    name: Standalone koed-server package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build standalone koed-server package
        env:
          KOED_SERVER_PACKAGE_VERSION: ${{ github.sha }}
          SOURCE_DATE_EPOCH: 0
        run: pnpm koed-server:package -- --platform linux --arch x64 --json

      - name: Upload standalone koed-server package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koed-server-package-linux-x64
          path: |
            dist/koed-server-package/linux-x64/*.tar.gz
            dist/koed-server-package/linux-x64/*.sha256
            dist/koed-server-package/linux-x64/koed-server-*/koed-server-package-manifest.json
            dist/koed-server-package/linux-x64/koed-server-*/README.txt
          if-no-files-found: error

  native-runtime-macos-arm64:
    name: Native runtime macOS arm64
    runs-on: macos-14
    timeout-minutes: 60
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.build_native_runtime_macos_arm64)

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build koed-server CLI
        run: pnpm --filter @koed/koed-server build

      - name: Build native runtime artifact
        env:
          KOED_NATIVE_RUNTIME_VERSION: ${{ github.sha }}
        run: pnpm native-runtime:build:macos-arm64 -- --json

      - name: Extract native runtime artifact for relocation validation
        run: |
          set -euo pipefail
          runtime_root="${RUNNER_TEMP}/koed-native-runtime-validation"
          mkdir -p "${runtime_root}"
          tarball="$(find dist/native-runtime/macos-arm64 -name 'koed-native-runtime-macos-arm64-*.tar.gz' -print -quit)"
          test -n "${tarball}"
          tar -xzf "${tarball}" -C "${runtime_root}"
          test -d "${runtime_root}/koed-runtime"

      - name: Validate native runtime artifact
        run: pnpm native-runtime:validate -- --runtime-root "${RUNNER_TEMP}/koed-native-runtime-validation/koed-runtime" --platform darwin --json

      - name: Upload native runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koed-native-runtime-macos-arm64
          path: |
            dist/native-runtime/macos-arm64/*.tar.gz
            dist/native-runtime/macos-arm64/*.sha256
            dist/native-runtime/macos-arm64/provenance.json

  native-runtime-linux-x64:
    name: Native runtime Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && inputs.build_native_runtime_linux_x64

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build koed-server CLI
        run: pnpm --filter @koed/koed-server build

      - name: Install native runtime build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libssl-dev curl ca-certificates

      - name: Build native runtime artifact
        env:
          KOED_NATIVE_RUNTIME_VERSION: ${{ github.sha }}
        run: pnpm native-runtime:build:linux-x64 -- --json

      - name: Validate native runtime artifact
        run: pnpm native-runtime:validate -- --runtime-root dist/native-runtime/linux-x64/koed-runtime --platform linux --json

      - name: Upload native runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koed-native-runtime-linux-x64
          path: |
            dist/native-runtime/linux-x64/*.tar.gz
            dist/native-runtime/linux-x64/*.sha256
            dist/native-runtime/linux-x64/provenance.json

  packaged-desktop-smoke:
    name: Packaged Desktop smoke
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Packaged Desktop missing-asset smoke
        run: pnpm desktop:package:smoke:mac -- --json --missing-assets

  packaged-desktop-native-smoke:
    name: Packaged Desktop native smoke and unsigned artifacts
    runs-on: macos-14
    timeout-minutes: 50
    needs: native-runtime-macos-arm64
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.build_native_runtime_macos_arm64)

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: koed-native-runtime-macos-arm64
          path: /tmp/koed-native-runtime-artifact

      - name: Extract native runtime artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/koed-native-runtime-extracted
          tarball="$(find /tmp/koed-native-runtime-artifact -name 'koed-native-runtime-macos-arm64-*.tar.gz' -print -quit)"
          test -n "${tarball}"
          tar -xzf "${tarball}" -C /tmp/koed-native-runtime-extracted
          test -d /tmp/koed-native-runtime-extracted/koed-runtime

      - name: Validate native runtime artifact
        run: pnpm native-runtime:validate -- --runtime-root /tmp/koed-native-runtime-extracted/koed-runtime --platform darwin --json

      - name: Build unsigned Desktop artifacts
        env:
          KOED_NATIVE_RUNTIME_SOURCE_DIR: /tmp/koed-native-runtime-extracted/koed-runtime
        run: pnpm desktop:package:internal:mac

      - name: Verify Desktop artifact code integrity
        run: cd apps/desktop && node scripts/verify-macos-package.mjs --app release/mac/Koed.app --dmg release/Koed-*-arm64.dmg

      - name: Packaged Desktop native smoke
        run: cd apps/desktop && node scripts/smoke-packaged-desktop-app.mjs --json --timeout-ms 420000 --diagnostics-dir "${RUNNER_TEMP}/koed-desktop-smoke-diagnostics"

      - name: Upload packaged Desktop smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koed-desktop-macos-arm64-smoke-diagnostics
          path: ${{ runner.temp }}/koed-desktop-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unsigned Desktop artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: koed-desktop-macos-arm64-unsigned
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
