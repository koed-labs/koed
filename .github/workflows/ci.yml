name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Format, Typecheck, Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: koed
          POSTGRES_USER: koed
          POSTGRES_PASSWORD: koed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koed -d koed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: pnpm setup:python

      - name: Check env examples are synced
        run: pnpm env:sync:check

      - name: Check formatting
        run: pnpm fmt:check

      - name: Check DB migration files
        run: pnpm db:migrate:check

      - name: Smoke DB migrations
        env:
          DATABASE_URL: postgres://koed:koed@127.0.0.1:5432/koed
        run: pnpm db:migrate:smoke

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck tests
        run: pnpm typecheck:test

      - name: Python checks
        run: pnpm test:python

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  python-dependencies:
    name: Python dependency resolution
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/embedding-service/requirements.txt
            apps/embedding-service/requirements-dev.txt

      - name: Check Python dependencies resolve
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run --report /tmp/embedding-service-dependencies.json \
            -r apps/embedding-service/requirements.txt \
            -r apps/embedding-service/requirements-dev.txt
