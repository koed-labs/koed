name: Oxlint TypeScript 7 configuration evaluation
on:
  push:
    branches:
      - eval/oxc-tooling
    paths:
      - .github/workflows/oxlint-ts7config-evaluation.yml
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
      - name: Prepare pinned source
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,tarfile,io,json,os,platform
          p=pathlib.Path('scratch/oxc-evaluation/ts7config-evaluation');p.mkdir(parents=True,exist_ok=True)
          source='f22c4f3bc7b0aaf3c74a2776c00f591c6ea677bf'
          files=subprocess.check_output(['git','ls-tree','-r','--name-only','-z',source]).decode().strip('\0').split('\0')
          (p/'source-files.json').write_text(json.dumps(files))
          d=pathlib.Path('scratch/oxc-evaluation/ts7config-workspace');d.mkdir(parents=True,exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(subprocess.check_output(['git','archive',source]))) as t:t.extractall(d,filter='data')
          subprocess.run(['git','init','--quiet',str(d)],check=True)
          (p/'environment.json').write_text(json.dumps({'source':source,'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'node':subprocess.check_output(['node','--version']).decode().strip(),'pnpm':subprocess.check_output(['pnpm','--version']).decode().strip(),'runner':os.environ.get('RUNNER_NAME'),'platform':platform.platform()},indent=2))

          PY
      - name: Install complete workspace dependencies and pinned tooling
        run: |
          pnpm install --frozen-lockfile > scratch/oxc-evaluation/ts7config-evaluation/root-install.log 2>&1
          pnpm --dir scratch/oxc-evaluation/ts7config-workspace install --frozen-lockfile > scratch/oxc-evaluation/ts7config-evaluation/workspace-install.log 2>&1
          npm install --prefix scratch/oxc-evaluation/tools --save-exact --ignore-scripts --no-audit --no-fund @oxlint/migrate@1.90.0 oxlint@1.90.0 oxlint-tsgolint@7.0.2005 > scratch/oxc-evaluation/ts7config-evaluation/tools-install.log 2>&1
      - name: Test TypeScript 7-compatible configuration with TypeScript 6
        run: |
          cat > scratch/oxc-evaluation/ts7config-check.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          import ts from '../../node_modules/typescript/lib/typescript.js';
          import {ESLint} from '../../node_modules/eslint/lib/api.js';
          const root=process.cwd();
          const out=path.resolve('scratch/oxc-evaluation/ts7config-evaluation');
          const workspace=path.resolve('scratch/oxc-evaluation/ts7config-workspace');
          const tools=path.resolve('scratch/oxc-evaluation/tools/node_modules');
          const env={...process.env,PATH:path.join(tools,'.bin')+path.delimiter+process.env.PATH,NODE_OPTIONS:'--max-old-space-size=8192'};
          fs.mkdirSync(out,{recursive:true});
          const sourceFiles=JSON.parse(fs.readFileSync(path.join(out,'source-files.json')));
          const commands=[];
          function run(label,cmd,args){
           const start=Date.now();const r=spawnSync(cmd,args,{cwd:workspace,env,encoding:'utf8',maxBuffer:256*1024*1024});
           fs.writeFileSync(path.join(out,label+'.stdout'),r.stdout??'');fs.writeFileSync(path.join(out,label+'.stderr'),r.stderr??'');
           commands.push({label,cmd,args,status:r.status,signal:r.signal,seconds:(Date.now()-start)/1000,error:r.error?.message});
           fs.writeFileSync(path.join(out,'commands.json'),JSON.stringify(commands,null,2));
           if(r.error)throw r.error;return r;
          }
          const hash=()=>Object.fromEntries(sourceFiles.map(f=>{const p=path.join(workspace,f);const data=fs.lstatSync(p).isSymbolicLink()?Buffer.from('symlink:'+fs.readlinkSync(p)):fs.readFileSync(p);return [f,crypto.createHash('sha256').update(data).digest('hex')];}));
          const before=hash();
          const configFiles=sourceFiles.filter(f=>/(^|\/)tsconfig[^/]*\.json$/.test(f));
          function parseConfig(f){
           const p=path.join(workspace,f);const read=ts.readConfigFile(p,ts.sys.readFile);if(read.error)throw Error(ts.flattenDiagnosticMessageText(read.error.messageText,'\n'));
           const parsed=ts.parseJsonConfigFileContent(read.config,ts.sys,path.dirname(p),undefined,p);
           if(parsed.errors.length)throw Error(f+': '+parsed.errors.map(d=>ts.flattenDiagnosticMessageText(d.messageText,'\n')).join('\n'));
           return parsed;
          }
          const originalConfigs=Object.fromEntries(configFiles.map(f=>[f,parseConfig(f)]));
          const changes=[];
          for(const file of configFiles){
           const full=path.join(workspace,file),original=fs.readFileSync(full,'utf8'),c=JSON.parse(original),options=c.compilerOptions;
           if(!options)continue;
           let changed=false;
           if(options.paths){
            const base=originalConfigs[file].options.baseUrl??path.dirname(full);
            for(const [alias,targets]of Object.entries(options.paths))options.paths[alias]=targets.map(target=>{let relative=path.relative(path.dirname(full),path.resolve(base,target)).split(path.sep).join('/');if(!relative.startsWith('.'))relative='./'+relative;return relative;});
            // Preserve the old baseUrl lookup root, including inferred declaration names.
            if(originalConfigs[file].options.baseUrl&&!Object.hasOwn(options.paths,'*')){let prefix=path.relative(path.dirname(full),base).split(path.sep).join('/');if(!prefix)prefix='.';else if(!prefix.startsWith('.'))prefix='./'+prefix;options.paths['*']=[prefix+'/*'];}
            changed=true;
           }
           if(Object.hasOwn(options,'baseUrl')){delete options.baseUrl;changed=true;}
           if(options.ignoreDeprecations==='6.0'){delete options.ignoreDeprecations;changed=true;}
           if(changed){fs.writeFileSync(full,JSON.stringify(c,null,2)+'\n');changes.push(file);fs.mkdirSync(path.dirname(path.join(out,'configs-before',file)),{recursive:true});fs.mkdirSync(path.dirname(path.join(out,'configs-after',file)),{recursive:true});fs.writeFileSync(path.join(out,'configs-before',file),original);}
          }
          if(JSON.stringify(changes.slice().sort())!==JSON.stringify(['tsconfig.base.json','apps/desktop/tsconfig.json','apps/desktop/tsconfig.electron.json'].sort()))throw Error('Unexpected config edit set: '+changes);
          const formatted=run('format-configs',path.join(workspace,'node_modules/.bin/prettier'),['--write','--object-wrap','collapse',...changes]);if(formatted.status!==0)throw Error('Config formatting failed');
          for(const file of changes)fs.copyFileSync(path.join(workspace,file),path.join(out,'configs-after',file));
          const updatedConfigs=Object.fromEntries(configFiles.map(f=>[f,parseConfig(f)]));
          if(configFiles.some(f=>updatedConfigs[f].options.baseUrl))throw Error('Inherited baseUrl remains');
          fs.writeFileSync(path.join(out,'config-changes.json'),JSON.stringify(changes,null,2));
          const diff=spawnSync('git',['diff','--no-index','--',path.join(out,'configs-before'),path.join(out,'configs-after')],{encoding:'utf8',maxBuffer:1024*1024});fs.writeFileSync(path.join(out,'configuration.diff'),diff.stdout??'');
          if(process.argv.includes('--prepare-only')){console.log(JSON.stringify({compiler:ts.version,changed:changes,parsedConfigs:configFiles.length},null,2));process.exit(0);}
          const compiler=JSON.parse(fs.readFileSync(path.join(workspace,'node_modules/typescript/package.json'))).version;
          if(compiler!=='6.0.3'||ts.version!==compiler)throw Error('Compiler version changed');
          const migrator=path.join(tools,'@oxlint/migrate/dist/bin/oxlint-migrate.mjs');
          const migrated=run('migration',process.execPath,[migrator,'eslint.config.js','--type-aware','--details','--with-nursery','--output-file','.oxlintrc.json']);
          if(migrated.status!==0)throw Error('Migration failed');
          const config=JSON.parse(fs.readFileSync(path.join(workspace,'.oxlintrc.json')));
          const index=config.overrides.findIndex(o=>o.rules?.['typescript/no-base-to-string']==='error'&&o.rules?.['typescript/require-await']==='error');
          if(index<0)throw Error('Production override missing');
          config.overrides.splice(index+1,0,{files:['apps/api/src/**/*.{test,spec}.ts','apps/worker/src/**/*.{test,spec}.ts','packages/*/src/**/*.{test,spec}.ts'],rules:Object.fromEntries(Object.keys(config.overrides[index].rules).map(k=>[k,'off']))});
          config.env={...config.env,builtin:false,es2022:true};
          const eslint=new ESLint({cwd:workspace,cache:false});const files=[],typedFiles=[],inlineGlobals=[];
          for(const file of sourceFiles){
           if(!/\.(?:js|mjs|cjs|ts|tsx|jsx|mts|cts)$/.test(file)||await eslint.isPathIgnored(file))continue;
           const c=await eslint.calculateConfigForFile(file);if(!c)continue;files.push(file);
           const floating=c.rules['@typescript-eslint/no-floating-promises'];if(floating?.[0]===2)typedFiles.push(file);
           const text=fs.readFileSync(path.join(workspace,file),'utf8'),globals={};
           for(const match of text.matchAll(/\/\*\s*globals?\s+([\s\S]*?)\*\//g))for(const part of match[1].split(',')){const[k,mode]=part.trim().split(/\s*:\s*/);if(k)globals[k]=mode==='true'||mode==='writable'?'writable':'readonly';}
           if(Object.keys(globals).length){config.overrides.push({files:[file],globals});inlineGlobals.push({file,globals});}
          }
          fs.writeFileSync(path.join(workspace,'.oxlintrc.json'),JSON.stringify(config,null,2));fs.writeFileSync(path.join(out,'oxlint.json'),JSON.stringify(config,null,2));
          fs.writeFileSync(path.join(out,'lint-files.json'),JSON.stringify(files.sort(),null,2));fs.writeFileSync(path.join(out,'inline-globals.json'),JSON.stringify(inlineGlobals,null,2));
          const lint=run('eslint',path.join(workspace,'node_modules/.bin/eslint'),['.','--no-cache','-f','json','-o',path.join(out,'eslint-diagnostics.json')]);
          const actual=JSON.parse(fs.readFileSync(path.join(out,'eslint-diagnostics.json')));const actualFiles=actual.map(r=>path.relative(workspace,r.filePath)).sort();
          if(JSON.stringify(actualFiles)!==JSON.stringify(files.slice().sort())||files.length!==2055)throw Error('ESLint coverage changed');
          const oxlint=path.join(tools,'.bin/oxlint');
          function native(label,extra=[]){const r=run(label,oxlint,['--type-aware','--tsconfig','tsconfig.eslint.json','-c','.oxlintrc.json','--report-unused-disable-directives-severity','warn','-f','json',...extra]);const data=JSON.parse(r.stdout);const counts={};for(const d of data.diagnostics){const key=d.code??'warning';counts[key]=(counts[key]??0)+1;}return {status:r.status,files:data.number_of_files,counts,data};}
          const unbuilt=native('oxlint-before-declarations');
          const production=run('typecheck-production','pnpm',['typecheck']);
          const tests=run('typecheck-tests','pnpm',['typecheck:test']);
          const electron=run('typecheck-electron','pnpm',['exec','tsc','-p','apps/desktop/tsconfig.electron.json','--noEmit']);
          const browser=run('typecheck-browser','pnpm',['exec','tsc','-p','apps/api/tsconfig.browser.json','--noEmit']);
          const built=native('oxlint-after-declarations');
          const compilerDiagnostics=native('oxlint-with-type-errors',['--type-check']);
          const resolutionChanges=[],resolutionCounts={comparisons:0,baselineUnresolved:0,candidateUnresolved:0};const imports=new Map();
          function moduleNames(file){if(imports.has(file))return imports.get(file);const sf=ts.createSourceFile(file,fs.readFileSync(file,'utf8'),ts.ScriptTarget.Latest,false);const names=new Set();function visit(n){if((ts.isImportDeclaration(n)||ts.isExportDeclaration(n))&&n.moduleSpecifier&&ts.isStringLiteralLike(n.moduleSpecifier))names.add(n.moduleSpecifier.text);if(ts.isImportEqualsDeclaration(n)&&ts.isExternalModuleReference(n.moduleReference)&&n.moduleReference.expression&&ts.isStringLiteralLike(n.moduleReference.expression))names.add(n.moduleReference.expression.text);if(ts.isCallExpression(n)&&(n.expression.kind===ts.SyntaxKind.ImportKeyword||(ts.isIdentifier(n.expression)&&n.expression.text==='require'))&&n.arguments.length&&ts.isStringLiteralLike(n.arguments[0]))names.add(n.arguments[0].text);if(ts.isImportTypeNode(n)&&ts.isLiteralTypeNode(n.argument)&&ts.isStringLiteralLike(n.argument.literal))names.add(n.argument.literal.text);ts.forEachChild(n,visit);}visit(sf);const result=[...names];imports.set(file,result);return result;}
          for(const file of configFiles.filter(f=>f!=='tsconfig.base.json')){
           const old=originalConfigs[file],now=updatedConfigs[file];const oldCache=ts.createModuleResolutionCache(workspace,f=>f,old.options),newCache=ts.createModuleResolutionCache(workspace,f=>f,now.options);
           for(const source of old.fileNames)for(const name of moduleNames(source))for(const mode of [ts.ModuleKind.ESNext,ts.ModuleKind.CommonJS]){
            const a=ts.resolveModuleName(name,source,old.options,ts.sys,oldCache,undefined,mode).resolvedModule?.resolvedFileName;
            const b=ts.resolveModuleName(name,source,now.options,ts.sys,newCache,undefined,mode).resolvedModule?.resolvedFileName;
            resolutionCounts.comparisons++;if(!a)resolutionCounts.baselineUnresolved++;if(!b)resolutionCounts.candidateUnresolved++;
            if(a!==b)resolutionChanges.push({project:file,file:path.relative(workspace,source),specifier:name,mode,baseline:a??null,candidate:b??null});
           }
          }
          fs.writeFileSync(path.join(out,'resolution-comparison.json'),JSON.stringify({...resolutionCounts,changes:resolutionChanges},null,2));
          const declarations=typedFiles.filter(f=>/\.d\.ts$/.test(f));const executable=typedFiles.filter(f=>!declarations.includes(f));const contents=new Map();let coverage;
          try{
           for(const file of executable){const full=path.join(workspace,file),bytes=fs.readFileSync(full);contents.set(file,bytes);fs.writeFileSync(full,Buffer.concat([bytes,Buffer.from('\nglobalThis.Promise.resolve("__oxc_typed_coverage_probe__");\n')]));}
           coverage=native('oxlint-coverage-canaries');
          }finally{for(const[file,bytes]of contents)fs.writeFileSync(path.join(workspace,file),bytes);}
          const observed=new Set();
          for(const d of coverage.data.diagnostics)if(d.code==='typescript(no-floating-promises)'&&contents.has(d.filename)&&d.labels?.some(l=>l.span?.offset>=contents.get(d.filename).byteLength))observed.add(d.filename);
          const missing=executable.filter(f=>!observed.has(f));
          const after=hash();const changedSources=sourceFiles.filter(f=>before[f]!==after[f]);
          if(JSON.stringify(changedSources.slice().sort())!==JSON.stringify(changes.slice().sort()))throw Error('Unexpected source edits or unrestored canaries');
          const simple=x=>({status:x.status,files:x.files,counts:x.counts});
          const result={compiler,configFiles:configFiles.length,changedConfigs:changes,sourceChanges:changedSources,lint:{status:lint.status,files:actual.length,errors:actual.reduce((n,r)=>n+r.errorCount,0),warnings:actual.reduce((n,r)=>n+r.warningCount,0)},typechecks:{production:production.status,tests:tests.status,electron:electron.status,browser:browser.status},resolution:{...resolutionCounts,changed:resolutionChanges.length},native:{beforeDeclarations:simple(unbuilt),afterDeclarations:simple(built),withCompilerErrors:simple(compilerDiagnostics)},typedCoverage:{intended:typedFiles.length,declarations:declarations.length,executable:executable.length,observed:observed.size,missing},inlineGlobalFiles:inlineGlobals.length};
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));
          if(lint.status||production.status||tests.status||electron.status||browser.status||resolutionChanges.length)throw Error('Existing TypeScript 6 checks or module resolution regressed');
          if((built.counts['typescript(tsconfig-error)']??0)!==0)throw Error('TypeScript 7 configuration errors remain');

          JS
          node scratch/oxc-evaluation/ts7config-check.mjs
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oxlint-ts7config-evaluation
          path: |-
            scratch/oxc-evaluation/ts7config-evaluation/
            scratch/oxc-evaluation/ts7config-check.mjs
            scratch/oxc-evaluation/tools/package-lock.json
          retention-days: 14
    env:
      NODE_OPTIONS: --max-old-space-size=8192
