name: Oxlint official migrator evaluation
on:
  push:
    branches:
      - eval/oxc-tooling
    paths:
      - .github/workflows/oxlint-migrate-evaluation.yml
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.2
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.13.1
      - name: Prepare pinned source
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,tarfile,io,json,os,platform
          p=pathlib.Path('scratch/oxc-evaluation/migrate-evaluation');p.mkdir(parents=True,exist_ok=True)
          source='f22c4f3bc7b0aaf3c74a2776c00f591c6ea677bf'
          files=subprocess.check_output(['git','ls-tree','-r','--name-only','-z',source]).decode().strip('\0').split('\0')
          (p/'source-files.json').write_text(json.dumps(files))
          d=pathlib.Path('scratch/oxc-evaluation/migrate-workspace');d.mkdir(parents=True,exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(subprocess.check_output(['git','archive',source]))) as t:t.extractall(d,filter='data')
          subprocess.run(['git','init','--quiet',str(d)],check=True)
          (p/'environment.json').write_text(json.dumps({'source':source,'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'node':subprocess.check_output(['node','--version']).decode().strip(),'pnpm':subprocess.check_output(['pnpm','--version']).decode().strip(),'runner':os.environ.get('RUNNER_NAME'),'platform':platform.platform()},indent=2))

          PY
      - name: Install complete workspace dependencies and pinned tooling
        run: |
          pnpm install --frozen-lockfile > scratch/oxc-evaluation/migrate-evaluation/root-install.log 2>&1
          pnpm --dir scratch/oxc-evaluation/migrate-workspace install --frozen-lockfile > scratch/oxc-evaluation/migrate-evaluation/workspace-install.log 2>&1
          npm install --prefix scratch/oxc-evaluation/tools --save-exact --ignore-scripts --no-audit --no-fund @oxlint/migrate@1.90.0 oxlint@1.90.0 oxlint-tsgolint@7.0.2005 > scratch/oxc-evaluation/migrate-evaluation/tools-install.log 2>&1
      - name: Generate and compare official migration candidates
        run: |
          cat > scratch/oxc-evaluation/migrate-check.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {createRequire} from 'node:module';
          import {spawnSync} from 'node:child_process';
          import {ESLint} from '../../node_modules/eslint/lib/api.js';
          import tseslint from '../../node_modules/typescript-eslint/dist/index.js';
          const root=process.cwd();
          const out=path.resolve('scratch/oxc-evaluation/migrate-evaluation');
          const workspace=path.resolve('scratch/oxc-evaluation/migrate-workspace');
          const tools=path.resolve('scratch/oxc-evaluation/tools/node_modules');
          const require=createRequire(fs.realpathSync(path.join(root,'node_modules/eslint/package.json')));
          const {Minimatch}=require('minimatch');
          const env={...process.env,PATH:path.join(tools,'.bin')+path.delimiter+process.env.PATH,NODE_OPTIONS:'--max-old-space-size=8192'};
          fs.mkdirSync(out,{recursive:true});
          const commands=[];
          function run(label,command,args,cwd=workspace){
           const result=spawnSync(command,args,{cwd,env,encoding:'utf8',maxBuffer:128*1024*1024});
           fs.writeFileSync(path.join(out,label+'.stdout'),result.stdout??'');
           fs.writeFileSync(path.join(out,label+'.stderr'),result.stderr??'');
           commands.push({label,command,args,cwd,status:result.status,error:result.error?.message});
           fs.writeFileSync(path.join(out,'commands.json'),JSON.stringify(commands,null,2));
           if(result.error)throw result.error;
           return result;
          }
          const migrator=path.join(tools,'@oxlint/migrate/dist/bin/oxlint-migrate.mjs');
          const oxlint=path.join(tools,'.bin/oxlint');
          const sourceFiles=JSON.parse(fs.readFileSync(path.join(out,'source-files.json')));
          const hashes=()=>Object.fromEntries(sourceFiles.map(f=>[f,crypto.createHash('sha256').update(fs.readFileSync(path.join(workspace,f))).digest('hex')]));
          const before=hashes();
          for(const [name,extra] of [['default',[]],['nursery',['--with-nursery']]]){
           const output='.oxlintrc.'+name+'.json';
           const result=run('migrate-'+name,process.execPath,[migrator,'eslint.config.js','--type-aware','--details',...extra,'--output-file',output]);
           if(result.status!==0)throw Error('Migration failed: '+name);
           fs.copyFileSync(path.join(workspace,output),path.join(out,name+'.json'));
          }
          const restored=JSON.parse(fs.readFileSync(path.join(out,'nursery.json')));
          const productionIndex=restored.overrides.findIndex(o=>o.rules?.['typescript/no-base-to-string']==='error'&&o.rules?.['typescript/require-await']==='error');
          if(productionIndex<0)throw Error('Production override not found');
          restored.overrides.splice(productionIndex+1,0,{files:['apps/api/src/**/*.{test,spec}.ts','apps/worker/src/**/*.{test,spec}.ts','packages/*/src/**/*.{test,spec}.ts'],rules:Object.fromEntries(Object.keys(restored.overrides[productionIndex].rules).map(k=>[k,'off']))});
          fs.writeFileSync(path.join(out,'scopes-restored.json'),JSON.stringify(restored,null,2));
          fs.copyFileSync(path.join(out,'scopes-restored.json'),path.join(workspace,'.oxlintrc.scopes-restored.json'));
          const eslint=new ESLint({cwd:workspace,cache:false});
          const baseline=await eslint.lintFiles(['.']);
          fs.writeFileSync(path.join(out,'eslint-diagnostics.json'),JSON.stringify(baseline,null,2));
          if(baseline.some(r=>r.errorCount||r.warningCount))throw Error('Baseline lint does not pass');
          const files=baseline.map(r=>path.relative(workspace,r.filePath)).sort();
          const configs={};
          for(const f of files)configs[f]=await eslint.calculateConfigForFile(f);
          const normalize=k=>k.startsWith('@typescript-eslint/')?(['no-array-constructor','no-unused-expressions','no-unused-vars'].includes(k.split('/')[1])?'eslint/':'typescript/')+k.split('/')[1]:k.includes('/')?k:'eslint/'+k;
          const severity=v=>{v=Array.isArray(v)?v[0]:v;return typeof v==='number'?v:({off:0,allow:0,warn:1,error:2,deny:2}[v]??0)};
          const compile=c=>(c.overrides??[]).map(o=>({...o,matchers:o.files.map(p=>new Minimatch(p,{dot:true}))}));
          function effective(c,overrides,file){
           const r={};for(const [k,v]of Object.entries(c.rules??{}))r[normalize(k)]=v;
           for(const o of overrides)if(o.matchers.some(m=>m.match(file)))for(const[k,v]of Object.entries(o.rules??{}))r[normalize(k)]=v;
           return r;
          }
          const ruleDifferences={},coverage={},diagnostics={};
          for(const name of ['default','nursery','scopes-restored']){
           const c=JSON.parse(fs.readFileSync(path.join(out,name+'.json'))),overrides=compile(c);const differences=[];
           for(const f of files){
            const actual=effective(c,overrides,f);const expected={};
            for(const[k,v]of Object.entries(configs[f].rules))if(severity(v))expected[normalize(k)]=v;
            for(const rule of new Set([...Object.keys(expected),...Object.keys(actual)])){
             if(severity(expected[rule])!==severity(actual[rule]))differences.push({file:f,rule,expected:expected[rule]??[0],actual:actual[rule]??[0]});
            }
           }
           ruleDifferences[name]=differences;
           fs.writeFileSync(path.join(out,name+'-rule-differences.json'),JSON.stringify(differences,null,2));
           const listed=run(name+'-files',oxlint,['-c','.oxlintrc.'+name+'.json','--debug','files']);
           if(listed.status!==0)throw Error('Traversal failed');
           const actualFiles=listed.stdout.trim().split('\n').filter(Boolean).sort();
           coverage[name]={count:actualFiles.length,missing:files.filter(f=>!actualFiles.includes(f)),extra:actualFiles.filter(f=>!files.includes(f))};
           const result=run(name+'-typed',oxlint,['--type-aware','--tsconfig','tsconfig.eslint.json','-c','.oxlintrc.'+name+'.json','-f','json']);
           const data=JSON.parse(result.stdout);diagnostics[name]={status:result.status,counts:{},configErrors:[]};
           for(const d of data.diagnostics){const key=d.code??'warning';diagnostics[name].counts[key]=(diagnostics[name].counts[key]??0)+1;if(key==='typescript(tsconfig-error)')diagnostics[name].configErrors.push(d);}
          }
          // Fixtures use real repository-shaped paths so migrated globs are exercised.
          const probe=path.join(out,'probes');fs.mkdirSync(probe,{recursive:true});
          spawnSync('git',['init','--quiet',probe]);
          fs.writeFileSync(path.join(probe,'tsconfig.json'),JSON.stringify({compilerOptions:{target:'ES2022',module:'NodeNext',strict:true,noEmit:true,types:[],skipLibCheck:true,jsx:'react-jsx'},include:['apps/**/*','packages/**/*','*.config.ts']},null,2));
          const samples={
           'await-thenable':'export async function f() { await 1; }',
           'no-floating-promises':'Promise.resolve(1); export {};',
           'no-misused-promises':'export function f() { [1].forEach(async () => { await Promise.resolve(); }); }',
           'no-unsafe-argument':'declare const value: any; function takes(x: string) {return x;} export const result = takes(value);',
           'no-unsafe-assignment':'declare const value: any; export const result: string = value;',
           'no-unsafe-member-access':'declare const value: any; export const result = value.foo;',
           'no-unsafe-return':'declare const value: any; export function f(): string { return value; }',
           'no-base-to-string':'export const result = String({});',
           'prefer-promise-reject-errors':'Promise.reject("bad").catch(() => {}); export {};',
           'require-await':'export async function f() { return 1; }'
          };
          const scopes={
           production:{representative:'apps/api/src/analytics/index.ts',prefix:'apps/api/src/migrate-probe/',suffix:'.ts'},
           selectedTest:{representative:'packages/shared/src/client-foundation.test.ts',prefix:'packages/shared/src/migrate-probe/',suffix:'.test.ts'},
           otherTest:{representative:'apps/api/src/auth/remote-mcp-oauth-routes.test.ts',prefix:'apps/api/src/migrate-probe/',suffix:'.test.ts'},
           tsx:{representative:'apps/api/src/browser-approval/AuthPanel.tsx',prefix:'apps/api/src/browser-approval/migrate-probe/',suffix:'.tsx'},
           configuration:{representative:'vitest.config.ts',prefix:'migrate-',suffix:'.config.ts'}
          };
          const cases=[],baselineOverrides=[];
          for(const [scope,definition]of Object.entries(scopes)){
           const rules=Object.fromEntries(Object.keys(samples).map(rule=>['@typescript-eslint/'+rule,configs[definition.representative].rules['@typescript-eslint/'+rule]??[0]]));
           for(const[rule,code]of Object.entries(samples))for(const suppressed of [false,true]){
            const file=definition.prefix+rule+(suppressed?'-suppressed':'-failing')+definition.suffix;
            fs.mkdirSync(path.dirname(path.join(probe,file)),{recursive:true});
            fs.writeFileSync(path.join(probe,file),(suppressed?`/* eslint-disable @typescript-eslint/${rule} */\n`:'')+code+'\n');
            cases.push({scope,rule,file,suppressed,expected:!!severity(rules['@typescript-eslint/'+rule])&&!suppressed});
            baselineOverrides.push({files:[file],rules});
           }
          }
          const fixtureEslint=new ESLint({cwd:probe,cache:false,overrideConfigFile:true,overrideConfig:[{files:['**/*.ts','**/*.tsx'],languageOptions:{parser:tseslint.parser,parserOptions:{project:'./tsconfig.json',tsconfigRootDir:probe}},plugins:{'@typescript-eslint':tseslint.plugin}},...baselineOverrides,{linterOptions:{reportUnusedDisableDirectives:false}}]});
          const fixtureBaseline=await fixtureEslint.lintFiles(['apps','packages','*.config.ts']);
          for(const c of cases){const result=fixtureBaseline.find(x=>path.relative(probe,x.filePath)===c.file);c.eslintDetected=result.messages.some(m=>m.ruleId==='@typescript-eslint/'+c.rule);if(c.eslintDetected!==c.expected)throw Error('Fixture baseline mismatch: '+c.file);}
          const fixtureResults={};
          for(const name of ['default','nursery','scopes-restored']){
           const configName='.oxlintrc.'+name+'.json';fs.copyFileSync(path.join(out,name+'.json'),path.join(probe,configName));
           const result=run(name+'-fixtures',oxlint,['--type-aware','-c',configName,'-f','json','.'],probe);
           const data=JSON.parse(result.stdout);
           const results=cases.map(c=>{const detected=data.diagnostics.some(d=>d.filename===c.file&&d.code==='typescript('+c.rule+')');return {...c,oxlintDetected:detected,pass:detected===c.expected};});
           fs.writeFileSync(path.join(out,name+'-fixture-results.json'),JSON.stringify(results,null,2));
           fixtureResults[name]={passing:results.filter(c=>c.pass).length,total:results.length,failures:results.filter(c=>!c.pass)};
          }
          const sourceUnchanged=JSON.stringify(before)===JSON.stringify(hashes());
          if(!sourceUnchanged)throw Error('Source files changed during migration');
          const summarizeDifferences=rows=>({fileRulePairs:rows.length,files:new Set(rows.map(r=>r.file)).size,rules:[...new Set(rows.map(r=>r.rule))],byRule:Object.fromEntries([...new Set(rows.map(r=>r.rule))].map(k=>[k,rows.filter(r=>r.rule===k).length]))});
          const summary={baseline:{files:files.length,errors:0,warnings:0},sourceUnchanged,coverage,ruleDifferences:Object.fromEntries(Object.entries(ruleDifferences).map(([k,v])=>[k,summarizeDifferences(v)])),diagnostics,fixtures:fixtureResults};
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2));
          console.log(JSON.stringify({...summary,diagnostics:Object.fromEntries(Object.entries(diagnostics).map(([k,v])=>[k,{status:v.status,counts:v.counts}])),fixtures:Object.fromEntries(Object.entries(fixtureResults).map(([k,v])=>[k,{passing:v.passing,total:v.total,failures:v.failures.map(c=>({scope:c.scope,rule:c.rule}))}]))},null,2));

          JS
          node scratch/oxc-evaluation/migrate-check.mjs
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oxlint-migrate-evaluation
          path: |-
            scratch/oxc-evaluation/migrate-evaluation/
            scratch/oxc-evaluation/migrate-check.mjs
            scratch/oxc-evaluation/tools/package-lock.json
          retention-days: 14
