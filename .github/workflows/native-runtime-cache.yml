name: Native runtime cache

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-runtime-cache.yml
      - package.json
      - scripts/native-runtime/sources.macos-arm64.json
      - scripts/native-runtime/procure-runtime.mjs
      - scripts/native-runtime/manifest-lib.mjs
      - scripts/native-runtime/build-macos-arm64.mjs
      - scripts/native-runtime/loader-validation-lib.mjs
      - scripts/native-runtime/validate-runtime.mjs
      - scripts/native-runtime-copy.mjs
  schedule:
    - cron: "47 3 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-runtime-cache-macos-arm64
  cancel-in-progress: false

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 11.1.2

jobs:
  maintain-native-runtime-cache:
    name: Maintain trusted macOS arm64 native runtime cache
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build koed-server CLI
        run: pnpm --filter @koed/koed-server build

      - name: Fingerprint native toolchain
        id: toolchain
        run: echo "fingerprint=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Restore trusted native runtime payload
        id: native-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/koed-native-runtime-cache/macos-arm64/koed-runtime
          key: native-runtime-payload-v3-macos-arm64-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('scripts/native-runtime/sources.macos-arm64.json', 'scripts/native-runtime/procure-runtime.mjs', 'scripts/native-runtime/manifest-lib.mjs', 'scripts/native-runtime/build-macos-arm64.mjs', 'scripts/native-runtime/loader-validation-lib.mjs', 'scripts/native-runtime/validate-runtime.mjs', 'scripts/native-runtime-copy.mjs') }}

      - name: Cold-build native runtime payload on cache miss
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          KOED_NATIVE_RUNTIME_VERSION: cache-seed
        run: |
          pnpm native-runtime:build:macos-arm64 -- --out-dir "${RUNNER_TEMP}/koed-native-runtime-cache-build" --json
          mkdir -p "${RUNNER_TEMP}/koed-native-runtime-cache/macos-arm64"
          ditto "${RUNNER_TEMP}/koed-native-runtime-cache-build/koed-runtime" "${RUNNER_TEMP}/koed-native-runtime-cache/macos-arm64/koed-runtime"

      - name: Validate native runtime payload before use or save
        run: pnpm native-runtime:validate -- --runtime-root "${RUNNER_TEMP}/koed-native-runtime-cache/macos-arm64/koed-runtime" --platform darwin --json

      - name: Save independently validated native runtime payload
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/koed-native-runtime-cache/macos-arm64/koed-runtime
          key: native-runtime-payload-v3-macos-arm64-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('scripts/native-runtime/sources.macos-arm64.json', 'scripts/native-runtime/procure-runtime.mjs', 'scripts/native-runtime/manifest-lib.mjs', 'scripts/native-runtime/build-macos-arm64.mjs', 'scripts/native-runtime/loader-validation-lib.mjs', 'scripts/native-runtime/validate-runtime.mjs', 'scripts/native-runtime-copy.mjs') }}
