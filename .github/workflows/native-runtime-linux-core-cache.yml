name: Linux native CPU core cache

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-runtime-linux-core-cache.yml
      - .github/workflows/ci.yml
      - package.json
      - pnpm-lock.yaml
      - scripts/native-runtime/*.linux-x64.json
      - scripts/native-runtime/build-core-linux-x64.mjs
      - scripts/native-runtime/core-artifact.mjs
      - scripts/native-runtime/procure-runtime.mjs
      - scripts/native-runtime/content-policy.mjs
      - scripts/native-runtime/manifest-lib.mjs
      - scripts/native-runtime/loader-validation-lib.mjs
      - scripts/native-runtime/validate-runtime.mjs
      - scripts/deterministic-tar-gzip.mjs
      - packages/koed-server/src/artifact-canonical-json.mjs
  schedule:
    - cron: "31 4 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-runtime-core-cache-linux-x64
  cancel-in-progress: false

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 11.1.2

jobs:
  maintain-native-core-cache:
    name: Maintain verified Linux CPU core cache
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build koed-server CLI
        run: pnpm --filter @koed-labs/server build

      - name: Restore Linux native CPU core
        id: native-core-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/koed-native-core
          key: linux-native-core-v1-jammy-node${{ env.NODE_VERSION }}-${{ hashFiles('scripts/native-runtime/*.linux-x64.json', 'scripts/native-runtime/build-core-linux-x64.mjs', 'scripts/native-runtime/core-artifact.mjs', 'scripts/native-runtime/procure-runtime.mjs', 'scripts/native-runtime/content-policy.mjs', 'scripts/native-runtime/manifest-lib.mjs', 'scripts/native-runtime/loader-validation-lib.mjs', 'scripts/deterministic-tar-gzip.mjs', 'packages/koed-server/src/artifact-canonical-json.mjs') }}

      - name: Build Linux native CPU core on a cache miss
        if: steps.native-core-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bison flex libssl-dev patchelf cmake
          node scripts/native-runtime/build-core-linux-x64.mjs --out-dir "${RUNNER_TEMP}/koed-native-core" --json

      - name: Verify Linux native CPU core
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/koed-native-core/koed-runtime"
          node --input-type=module -e 'import { verifyFrozenCore } from "./scripts/native-runtime/core-artifact.mjs"; verifyFrozenCore(process.argv[1]);' "${root}"
          pnpm native-runtime:validate -- --runtime-root "${root}" --platform linux --json > "${RUNNER_TEMP}/koed-native-core-validation.json" || {
            jq '{ok, errors}' "${RUNNER_TEMP}/koed-native-core-validation.json"
            exit 1
          }
          node --input-type=module -e 'import { verifyFrozenCore } from "./scripts/native-runtime/core-artifact.mjs"; verifyFrozenCore(process.argv[1]);' "${root}"

      - name: Save Linux native CPU core
        if: steps.native-core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/koed-native-core
          key: linux-native-core-v1-jammy-node${{ env.NODE_VERSION }}-${{ hashFiles('scripts/native-runtime/*.linux-x64.json', 'scripts/native-runtime/build-core-linux-x64.mjs', 'scripts/native-runtime/core-artifact.mjs', 'scripts/native-runtime/procure-runtime.mjs', 'scripts/native-runtime/content-policy.mjs', 'scripts/native-runtime/manifest-lib.mjs', 'scripts/native-runtime/loader-validation-lib.mjs', 'scripts/deterministic-tar-gzip.mjs', 'packages/koed-server/src/artifact-canonical-json.mjs') }}
