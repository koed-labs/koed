services:
  embedding-service:
    build:
      context: ../..
      dockerfile: apps/embedding-service/Dockerfile.cuda
    gpus: all
    environment:
      KOED_EMBEDDING_ACCELERATION: ${KOED_EMBEDDING_ACCELERATION:-cuda}
      KOED_EMBEDDING_GPU_IDLE_UNLOAD_SECONDS: ${KOED_EMBEDDING_GPU_IDLE_UNLOAD_SECONDS:-300}
      KOED_RERANKER_ACCELERATION: ${KOED_RERANKER_ACCELERATION:-cpu}
      KOED_RERANKER_GPU_IDLE_UNLOAD_SECONDS: ${KOED_RERANKER_GPU_IDLE_UNLOAD_SECONDS:-300}
